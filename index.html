<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Теоман</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #172b55 0%, #080d1b 45%, #050812 100%);
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 22px 18px 40px;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

.header-title {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 8px;
}

.online {
  color: #55e58a;
  font-size: 18px;
  font-weight: 600;
}

.chat {
  background: rgba(15, 23, 42, 0.82);
  border: 1px solid rgba(100, 130, 190, 0.35);
  border-radius: 28px;
  padding: 20px;
  min-height: 430px;
  max-height: 60vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
  backdrop-filter: blur(15px);
}

.message {
  padding: 15px 18px;
  border-radius: 22px;
  margin: 12px 0;
  max-width: 90%;
  font-size: 18px;
  line-height: 1.45;
  white-space: pre-wrap;
}

.user {
  background: linear-gradient(135deg, #4169e1, #5b7cff);
  margin-left: auto;
}

.bot {
  background: #182238;
  border: 1px solid #293858;
}

.input-row {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 18px;
  border-radius: 22px;
  border: 1px solid #304267;
  background: rgba(15, 23, 42, .9);
  color: white;
  font-size: 18px;
  outline: none;
}

input:focus {
  border-color: #5b7cff;
  box-shadow: 0 0 20px rgba(91,124,255,.2);
}

.send {
  width: 64px;
  border: none;
  border-radius: 22px;
  background: linear-gradient(135deg, #4169e1, #5b7cff);
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 20px;
  padding: 17px 20px;
  color: white;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .15s, opacity .15s;
}

button:active {
  transform: scale(.97);
}

.voice {
  background: linear-gradient(135deg, #48b85a, #69cf5d);
}

.speak {
  background: linear-gradient(135deg, #6336df, #814cff);
}

.clear {
  background: #29354d;
}

@media (max-width: 600px) {
  .container {
    padding: 18px 12px 30px;
  }

  .header-title {
    font-size: 27px;
  }

  .chat {
    min-height: 500px;
    border-radius: 24px;
    padding: 14px;
  }

  .message {
    font-size: 17px;
  }

  button {
    width: 100%;
    padding: 18px;
  }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        🟢 Теоман Онлайн
        <div class="online">Готов тебя слушать</div>
    </div>
    <div id="chat" class="chat"></div>
    <div class="input-area">
        <input
            id="input"
            type="text"
            placeholder="Напиши Теоману..."
            autocomplete="off"
        >
        <button class="send" onclick="sendMessage()">➤</button>
    </div>
    <div id="status" class="status"></div>
    <button
        id="voiceButton"
        class="voice"
        onclick="startVoice()">
        🎙️ Говорить с Теоманом
    </button>
    <button
        class="speak"
        onclick="speakLastAnswer()">
        🔊 Озвучить последний ответ
    </button>
    <button
        class="clear"
        onclick="clearChat()">
        🧹 Очистить память
    </button>
</div>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const statusText = document.getElementById("status");
const voiceButton = document.getElementById("voiceButton");
let lastAnswer = "";
let recognition = null;
/* =========================
   ПАМЯТЬ ПЕРЕПИСКИ
========================= */
let memory = JSON.parse(
    localStorage.getItem("teoman_memory") || "[]"
);
function saveMemory() {
    localStorage.setItem(
        "teoman_memory",
        JSON.stringify(memory)
    );
}
/* =========================
   ПОКАЗ ЧАТА
========================= */
function addMessage(text, type) {
    const message = document.createElement("div");
    message.className =
        "message " + type;
    message.textContent = text;
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
}
/* =========================
   ЗАГРУЗКА ПАМЯТИ
========================= */
function loadMemory() {
    chat.innerHTML = "";
    if (memory.length === 0) {
        addMessage(
            "Привет! 👋 Я Теоман. Чем могу помочь?",
            "bot"
        );
        return;
    }
    for (const item of memory) {
        addMessage(
            item.text,
            item.role === "user"
                ? "user"
                : "bot"
        );
        if (item.role === "assistant") {
            lastAnswer = item.text;
        }
    }
}
loadMemory();
/* =========================
   ОТПРАВКА СООБЩЕНИЯ
========================= */
async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, "user");
    memory.push({
        role: "user",
        text: message
    });
    saveMemory();
    input.value = "";
    statusText.textContent =
        "Теоман думает... 🤖";
    try {
        const response = await fetch(
            "/api/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            }
        );
        if (!response.ok) {
            throw new Error(
                "Ошибка сервера: " +
                response.status
            );
        }
        const data =
            await response.json();
        const answer =
            data.reply || "Я не получил ответ.";
        lastAnswer = answer;
        addMessage(
            answer,
            "bot"
        );
        memory.push({
            role: "assistant",
            text: answer
        });
        saveMemory();
        statusText.textContent = "";
    } catch (error) {
        console.error(error);
        addMessage(
            "Не получилось связаться с сервером 😕",
            "bot"
        );
        statusText.textContent =
            "Ошибка соединения";
    }
}
/* =========================
   ENTER = ОТПРАВИТЬ
========================= */
input.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
);
/* =========================
   ГОЛОСОВОЙ ВВОД
========================= */
function startVoice() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert(
            "Голосовой ввод не поддерживается этим браузером."
        );
        return;
    }
    if (recognition) {
        recognition.stop();
        recognition = null;
        return;
    }
    recognition =
        new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onstart = function() {
        voiceButton.classList.add(
            "listening"
        );
        voiceButton.textContent =
            "🔴 Слушаю тебя...";
        statusText.textContent =
            "Говори...";
    };
    recognition.onresult =
        function(event) {
            const text =
                event.results[0][0]
                .transcript;
            input.value = text;
            voiceButton.classList.remove(
                "listening"
            );
            voiceButton.textContent =
                "🎙️ Говорить с Теоманом";
            statusText.textContent = "";
            recognition.stop();
            recognition = null;
            sendMessage();
        };
    recognition.onerror =
        function(event) {
            console.log(
                "Ошибка микрофона:",
                event.error
            );
            voiceButton.classList.remove(
                "listening"
            );
            voiceButton.textContent =
                "🎙️ Говорить с Теоманом";
            statusText.textContent =
                "Не удалось услышать голос";
            recognition = null;
        };
    recognition.onend = function() {
        voiceButton.classList.remove(
            "listening"
        );
        voiceButton.textContent =
            "🎙️ Говорить с Теоманом";
        recognition = null;
    };
    recognition.start();
}
/* =========================
   ОЗВУЧИВАНИЕ
========================= */
function speakLastAnswer() {
    if (!lastAnswer) {
        alert(
            "Пока нечего озвучивать."
        );
        return;
    }
    window.speechSynthesis.cancel();
    const speech =
        new SpeechSynthesisUtterance(
            lastAnswer
        );
    speech.lang = "ru-RU";
    speech.rate = 1;
    speech.pitch = 1;
    window.speechSynthesis.speak(
        speech
    );
}
/* =========================
   ОЧИСТКА ПАМЯТИ
========================= */
function clearChat() {
    window.speechSynthesis.cancel();
    memory = [];
    localStorage.removeItem(
        "teoman_memory"
    );
    lastAnswer = "";
    chat.innerHTML = "";
    addMessage(
        "Чат очищен 🧹\nЯ снова готов тебя слушать!",
        "bot"
    );
    statusText.textContent = "";
}
</script>
</body>
</html>
