<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Теоман — ИИ помощник</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: #0b1120;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}
.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 20px;
}
h1 {
    text-align: center;
    font-size: 48px;
    margin: 20px 0 5px;
}
.subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 24px;
    margin-bottom: 35px;
}
.status {
    text-align: center;
    color: #22c55e;
    font-size: 25px;
    margin-bottom: 25px;
}
.chat {
    background: #111827;
    border: 2px solid #263650;
    border-radius: 28px;
    padding: 20px;
    min-height: 350px;
    max-height: 55vh;
    overflow-y: auto;
}
.message {
    padding: 18px 20px;
    border-radius: 22px;
    margin: 12px 0;
    font-size: 20px;
    line-height: 1.45;
}
.user {
    background: #2563eb;
    margin-left: 12%;
    text-align: right;
}
.teoman {
    background: #1e293b;
    margin-right: 8%;
}
.input-area {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}
input {
    flex: 1;
    min-width: 0;
    background: #111827;
    border: 2px solid #334155;
    border-radius: 25px;
    padding: 20px;
    color: white;
    font-size: 19px;
    outline: none;
}
.send {
    width: 80px;
    border: 0;
    border-radius: 25px;
    background: #2563eb;
    color: white;
    font-size: 30px;
}
.voice {
    width: 100%;
    margin-top: 20px;
    padding: 22px;
    border: 0;
    border-radius: 25px;
    background: #16a34a;
    color: white;
    font-size: 22px;
    font-weight: bold;
}
.voice.listening {
    background: #dc2626;
}
.speak {
    width: 100%;
    margin-top: 12px;
    padding: 17px;
    border: 0;
    border-radius: 20px;
    background: #334155;
    color: white;
    font-size: 19px;
}
.clear {
    width: 100%;
    margin-top: 15px;
    padding: 20px;
    border: 0;
    border-radius: 25px;
    background: #334155;
    color: white;
    font-size: 20px;
}
footer {
    text-align: center;
    color: #64748b;
    margin-top: 35px;
}
</style>
</head>
<body>
<div class="container">
<h1>🤖 Теоман</h1>
<div class="subtitle">
Твой личный ИИ-помощник
</div>
<div class="status">
🟢 Теоман онлайн
</div>
<div class="chat" id="chat">
<div class="message teoman">
🤖 Привет! Я Теоман. Нажми 🎤 и поговори со мной.
</div>
</div>
<div class="input-area">
<input id="input" placeholder="Напиши Теоману..." autocomplete="off">
<button class="send" onclick="sendMessage()">➤</button>
</div>
<button class="voice" id="voiceButton" onclick="startVoice()">
🎤 Говорить с Теоманом
</button>
<button class="speak" onclick="speakLast()">
🔊 Повторить последний ответ
</button>
<button class="clear" onclick="clearChat()">
🗑️ Очистить чат
</button>
<footer>
Теоман • версия 2.0
</footer>
</div>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const voiceButton = document.getElementById("voiceButton");
let lastAnswer = "";
let recognition = null;
let isListening = false;
/* =========================
   ГОЛОС ТЕОМАНА
========================= */
function speak(text) {
    if (!("speechSynthesis" in window)) {
        alert("Ваш браузер не поддерживает голос.");
        return;
    }
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ru-RU";
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.volume = 1;
    const voices = speechSynthesis.getVoices();
    const russianVoice =
        voices.find(v => v.lang === "ru-RU") ||
        voices.find(v => v.lang.startsWith("ru"));
    if (russianVoice) {
        utterance.voice = russianVoice;
    }
    speechSynthesis.speak(utterance);
}
function speakLast() {
    if (lastAnswer) {
        speak(lastAnswer);
    } else {
        speak("Пока нечего озвучивать.");
    }
}
/* =========================
   ДОБАВЛЕНИЕ СООБЩЕНИЙ
========================= */
function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
}
/* =========================
   ОТВЕТ ТЕОМАНА
========================= */
function getAnswer(text) {
    const lower = text.toLowerCase();
    if (
        lower.includes("привет") ||
        lower.includes("здравствуй")
    ) {
        return "Привет! Я Теоман. Рад тебя слышать 🤖";
    }
    if (
        lower.includes("как дела") ||
        lower.includes("как ты")
    ) {
        return "У меня всё отлично! Я онлайн и готов помогать.";
    }
    if (
        lower.includes("который час") ||
        lower.includes("сколько времени") ||
        lower.includes("сколько сейчас")
    ) {
        const now = new Date();
        return "Сейчас " +
            now.toLocaleTimeString("ru-RU", {
                hour: "2-digit",
                minute: "2-digit"
            });
    }
    if (
        lower.includes("турци") ||
        lower.includes("турция")
    ) {
        return "Турция — прекрасная страна с тёплым морем, красивыми курортами и богатой историей 🇹🇷";
    }
    if (
        lower.includes("кто ты")
    ) {
        return "Я Теоман — твой личный ИИ-помощник 🤖";
    }
    if (
        lower.includes("спасибо")
    ) {
        return "Пожалуйста! Всегда рад помочь.";
    }
    return "Я услышал тебя: «" + text +
        "». Сейчас я работаю в базовом режиме, но мы можем постепенно сделать меня намного умнее 🤖";
}
/* =========================
   ОТПРАВКА ТЕКСТА
========================= */
function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";
    const answer = getAnswer(text);
    lastAnswer = answer;
    setTimeout(() => {
        addMessage(answer, "teoman");
        // Озвучиваем ответ
        speak(answer);
    }, 300);
}
/* ENTER
========================= */
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
/* =========================
   ГОЛОСОВОЙ ВВОД
========================= */
function startVoice() {
    // ВАЖНО ДЛЯ iPhone:
    // сначала запускаем голос внутри нажатия кнопки.
    // Это помогает Safari разрешить дальнейшую озвучку.
    speak("Я слушаю тебя");
    if (
        !("webkitSpeechRecognition" in window) &&
        !("SpeechRecognition" in window)
    ) {
        alert(
            "Распознавание речи не поддерживается этим браузером."
        );
        return;
    }
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onstart = function() {
        isListening = true;
        voiceButton.classList.add("listening");
        voiceButton.textContent =
            "🔴 Слушаю тебя...";
    };
    recognition.onresult = function(event) {
        const text =
            event.results[0][0].transcript;
        input.value = text;
        addMessage(text, "user");
        input.value = "";
        const answer = getAnswer(text);
        lastAnswer = answer;
        setTimeout(() => {
            addMessage(answer, "teoman");
            speak(answer);
        }, 300);
    };
    recognition.onerror = function(event) {
        console.log("Ошибка микрофона:", event.error);
        voiceButton.textContent =
            "🎤 Говорить с Теоманом";
        voiceButton.classList.remove("listening");
        isListening = false;
    };
    recognition.onend = function() {
        isListening = false;
        voiceButton.classList.remove("listening");
        voiceButton.textContent =
            "🎤 Говорить с Теоманом";
    };
    recognition.start();
}
/* =========================
   ОЧИСТКА ЧАТА
========================= */
function clearChat() {
    chat.innerHTML = `
        <div class="message teoman">
            🤖 Чат очищен. Я снова готов тебя слушать.
        </div>
    `;
    lastAnswer = "";
    speechSynthesis.cancel();
}
</script>
</body>
</html>
