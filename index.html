<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Зея — AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #243b55 0%, #111827 45%, #05070b 100%);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 500px;
            min-height: 90vh;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            box-shadow: 0 0 35px rgba(96,165,250,0.45);
        }

        h1 {
            margin: 15px 0 5px;
            font-size: 30px;
        }

        .status {
            color: #9ca3af;
            font-size: 14px;
        }

        .chat {
            flex: 1;
            min-height: 250px;
            max-height: 45vh;
            overflow-y: auto;
            padding: 10px 0;
        }

        .message {
            padding: 13px 16px;
            margin: 10px 0;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .zeia {
            background: rgba(96,165,250,0.15);
            border: 1px solid rgba(96,165,250,0.2);
            margin-right: auto;
        }

        .user {
            background: rgba(167,139,250,0.25);
            margin-left: auto;
        }

        .photo-box {
            display: none;
            margin: 15px 0;
            text-align: center;
        }

        #preview {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 20px;
            background: #000;
        }

        .photo-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            border: 0;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .camera-button {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 8px 25px rgba(37,99,235,0.3);
            margin-bottom: 12px;
        }

        .camera-button:hover {
            filter: brightness(1.1);
        }

        .small-button {
            flex: 1;
            padding: 13px;
            border-radius: 15px;
            background: #374151;
        }

        .delete-button {
            background: #7f1d1d;
        }

        .voice-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .voice-button {
            flex: 1;
            padding: 16px;
            border-radius: 18px;
            background: #1f2937;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .voice-button.active {
            background: #dc2626;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #111827;
            color: white;
            outline: none;
            font-size: 16px;
        }

        .send-button {
            padding: 0 20px;
            border-radius: 16px;
            background: #2563eb;
        }

        #cameraInput {
            display: none;
        }

        .analyzing {
            color: #93c5fd;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.4;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🤖</div>

        <h1>Зея</h1>

        <div class="status" id="status">
            Твой AI-помощник
        </div>
    </div>

    <div class="chat" id="chat">

        <div class="message zeia">
            Привет! Я Зея 🤖<br>
            Теперь я умею работать с камерой 📸
        </div>

    </div>

    <!-- Фото -->
    <div class="photo-box" id="photoBox">

        <img id="preview" alt="Фото">

        <div class="photo-buttons">

            <button
                class="small-button"
                onclick="analyzePhoto()">
                🔍 Анализировать
            </button>

            <button
                class="small-button delete-button"
                onclick="deletePhoto()">
                🗑️ Удалить
            </button>

        </div>

    </div>

    <!-- Камера -->
    <button
        class="camera-button"
        onclick="openCamera()">
        📸 Открыть камеру
    </button>

    <!-- Настоящий input камеры -->
    <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
        onchange="photoSelected(event)">

    <!-- Голос -->
    <div class="voice-row">

        <button
            id="voiceButton"
            class="voice-button"
            onclick="startVoice()">
            🎙️ Говорить с Зеей
        </button>

    </div>

    <!-- Текст -->
    <div class="input-row">

        <input
            id="textInput"
            type="text"
            placeholder="Напиши Зее..."
            onkeydown="handleEnter(event)">

        <button
            class="send-button"
            onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>

<script>

    let currentPhoto = null;

    /* =========================
       ЧАТ
    ========================= */

    function addMessage(text, type = "user") {

        const chat = document.getElementById("chat");

        const message = document.createElement("div");

        message.className = "message " + type;

        message.innerHTML = text;

        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;
    }


    function sendMessage() {

        const input = document.getElementById("textInput");

        const text = input.value.trim();

        if (!text) return;

        addMessage(text, "user");

        input.value = "";

        setTimeout(() => {

            addMessage(
                "Я получила сообщение 😊 Сейчас подключим мой полноценный AI-мозг.",
                "zeia"
            );

        }, 500);
    }


    function handleEnter(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }


    /* =========================
       КАМЕРА
    ========================= */

    function openCamera() {

        document.getElementById("cameraInput").click();

    }


    function photoSelected(event) {

        const file = event.target.files[0];

        if (!file) return;

        currentPhoto = file;

        const imageURL = URL.createObjectURL(file);

        const preview = document.getElementById("preview");

        preview.src = imageURL;

        document.getElementById("photoBox").style.display = "block";

        addMessage(
            "📸 Я получила фотографию. Что будем с ней делать?",
            "zeia"
        );

    }


    /* =========================
       АНАЛИЗ ФОТО
    ========================= */

    function analyzePhoto() {

        if (!currentPhoto) {

            addMessage(
                "Сначала сделай фотографию 📸",
                "zeia"
            );

            return;
        }

        const status = document.getElementById("status");

        status.innerHTML =
            '<span class="analyzing">🔍 Анализирую фотографию...</span>';

        addMessage(
            "🔍 Анализирую изображение...",
            "zeia"
        );

        /*
         * Здесь позже подключим API.
         *
         * Фото будет отправляться на сервер,
         * а AI будет возвращать описание.
         */

        setTimeout(() => {

            status.innerText = "Твой AI-помощник";

            addMessage(
                "Фото получено 👍 Следующим шагом подключим настоящий AI-анализ, чтобы я могла рассказывать, что находится на фотографии.",
                "zeia"
            );

        }, 1200);

    }


    /* =========================
       УДАЛИТЬ ФОТО
    ========================= */

    function deletePhoto() {

        currentPhoto = null;

        document.getElementById("preview").src = "";

        document.getElementById("photoBox").style.display = "none";

        document.getElementById("cameraInput").value = "";

    }


    /* =========================
       ГОЛОС
    ========================= */

    function startVoice() {

        const button = document.getElementById("voiceButton");

        if (!("webkitSpeechRecognition" in window ||
              "SpeechRecognition" in window)) {

            addMessage(
                "К сожалению, голосовое управление не поддерживается этим браузером.",
                "zeia"
            );

            return;
        }

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        const recognition = new SpeechRecognition();

        recognition.lang = "ru-RU";

        recognition.continuous = false;

        recognition.interimResults = false;

        button.classList.add("active");

        button.innerText = "🔴 Слушаю...";

        recognition.start();

        recognition.onresult = function(event) {

            const text =
                event.results[0][0].transcript;

            document.getElementById("textInput").value = text;

            addMessage(text, "user");

            setTimeout(() => {

                addMessage(
                    "Я услышала тебя 😊",
                    "zeia"
                );

            }, 500);

        };

        recognition.onerror = function() {

            addMessage(
                "Не получилось услышать голос. Попробуй ещё раз.",
                "zeia"
            );

        };

        recognition.onend = function() {

            button.classList.remove("active");

            button.innerText =
                "🎙️ Говорить с Зеей";

        };

    }

</script>

</body>
</html>
