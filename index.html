<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Зея — AI помощник</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#070b16;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
}

.header{
    text-align:center;
    padding:20px 0;
}

.logo{
    width:120px;
    height:120px;
    margin:auto;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:65px;

    background:
        linear-gradient(
            135deg,
            #536dfe,
            #8e45e9
        );

    box-shadow:
        0 0 50px
        rgba(91,92,255,.4);
}

h1{
    margin:18px 0 4px;
    font-size:46px;
}

.status{
    color:#aaa;
    font-size:18px;
}

.language{
    width:100%;
    margin-top:15px;
    padding:15px;

    border-radius:18px;
    border:1px solid #34425d;

    background:#111827;
    color:white;

    font-size:17px;
}

.chat{
    flex:1;
    padding:10px 0 20px;
}

.message{
    padding:17px;
    margin:12px 0;

    border-radius:22px;

    font-size:18px;
    line-height:1.5;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.bot{
    background:#1b2948;
    border:1px solid #31538d;
}

.user{
    background:#49308b;
    margin-left:12%;
}

.error{
    background:#351d27;
    border:1px solid #8c3047;
}

.buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
}

button{
    width:100%;
    min-height:58px;

    border:0;
    border-radius:20px;

    color:white;

    font-size:18px;

    background:#1b263d;

    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.camera{
    background:
        linear-gradient(
            135deg,
            #315eea,
            #7139e9
        );
}

.input-area{
    display:flex;
    gap:9px;
    margin-top:12px;
}

input{
    flex:1;
    min-width:0;

    height:58px;

    border-radius:19px;
    border:1px solid #34425d;

    background:#111827;
    color:white;

    padding:0 16px;

    font-size:17px;

    outline:none;
}

.send{
    width:65px;
    background:#5435d9;
}

.loading{
    opacity:.7;
}

.preview{
    width:100%;
    max-height:350px;

    object-fit:contain;

    border-radius:18px;

    margin-top:12px;

    border:1px solid #34425d;
}

.hidden{
    display:none;
}

</style>
</head>


<body>

<div class="app">


<!-- ================= HEADER ================= -->

<div class="header">

    <div class="logo">
        🤖
    </div>

    <h1>Зея</h1>

    <div
        class="status"
        id="status"
    >
        Готова помочь ✨
    </div>


    <!-- ЯЗЫК -->

    <select
        id="language"
        class="language"
    >

        <option value="ru-RU">
            🇷🇺 Русский
        </option>

        <option value="tr-TR">
            🇹🇷 Türkçe
        </option>

        <option value="en-US">
            🇬🇧 English
        </option>

        <option value="de-DE">
            🇩🇪 Deutsch
        </option>

        <option value="fr-FR">
            🇫🇷 Français
        </option>

        <option value="es-ES">
            🇪🇸 Español
        </option>

        <option value="it-IT">
            🇮🇹 Italiano
        </option>

        <option value="ar-SA">
            🇸🇦 العربية
        </option>

        <option value="zh-CN">
            🇨🇳 中文
        </option>

        <option value="ja-JP">
            🇯🇵 日本語
        </option>

    </select>

</div>



<!-- ================= CHAT ================= -->

<div
    class="chat"
    id="chat"
>

    <div
        class="message bot"
        id="welcome"
    >
        Привет! Я Зея 🤖
        Я готова тебе помочь.
    </div>

</div>



<!-- ================= BUTTONS ================= -->

<div class="buttons">


    <!-- КАМЕРА -->

    <button
        class="camera"
        onclick="openCamera()"
    >
        📸 Камера
    </button>


    <!-- ГОЛОСОВОЙ ВВОД -->

    <button
        onclick="startVoice()"
    >
        🎙️ Говорить с Зеей
    </button>


    <!-- ОЗВУЧКА -->

    <button
        onclick="speakLast()"
    >
        🔊 Голос Зеи
    </button>

</div>



<!-- ================= INPUT ================= -->

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Напиши Зее..."
        autocomplete="off"
    >

    <button
        class="send"
        onclick="sendMessage()"
    >
        ➤
    </button>

</div>


</div>



<script>


/* =====================================================
   API
===================================================== */

const API_URL =
    "https://zeya-pi.vercel.app/api/chat";



/* =====================================================
   ELEMENTS
===================================================== */

const input =
    document.getElementById("input");

const chat =
    document.getElementById("chat");

const statusText =
    document.getElementById("status");

const language =
    document.getElementById("language");



/* =====================================================
   VARIABLES
===================================================== */

let lastAnswer = "";



/* =====================================================
   ЯЗЫКИ
===================================================== */

const languageNames = {

    "ru-RU":
        "русском",

    "tr-TR":
        "турецком",

    "en-US":
        "английском",

    "de-DE":
        "немецком",

    "fr-FR":
        "французском",

    "es-ES":
        "испанском",

    "it-IT":
        "итальянском",

    "ar-SA":
        "арабском",

    "zh-CN":
        "китайском",

    "ja-JP":
        "японском"

};



/* =====================================================
   PLACEHOLDER
===================================================== */

function getPlaceholder(lang){

    const placeholders = {

        "ru-RU":
            "Напиши Зее...",

        "tr-TR":
            "Zeya'ya yaz...",

        "en-US":
            "Write to Zeya...",

        "de-DE":
            "Schreibe Zeya...",

        "fr-FR":
            "Écris à Zeya...",

        "es-ES":
            "Escribe a Zeya...",

        "it-IT":
            "Scrivi a Zeya...",

        "ar-SA":
            "اكتب إلى زيا...",

        "zh-CN":
            "给泽娅写消息...",

        "ja-JP":
            "ゼヤにメッセージ..."

    };

    return placeholders[lang]
        || "Напиши Зее...";
}



/* =====================================================
   СМЕНА ЯЗЫКА
===================================================== */

language.addEventListener(
    "change",
    function(){

        const lang =
            language.value;

        const name =
            languageNames[lang];

        addMessage(
            "🌐 Язык изменён.\n" +
            "Теперь я отвечаю на " +
            name +
            ".",
            "bot"
        );

        input.placeholder =
            getPlaceholder(lang);

    }
);



/* =====================================================
   ДОБАВИТЬ СООБЩЕНИЕ
===================================================== */

function addMessage(text,type){

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    setTimeout(
        function(){

            window.scrollTo({

                top:
                    document.body.scrollHeight,

                behavior:
                    "smooth"

            });

        },
        50
    );

    return div;
}



/* =====================================================
   ОТПРАВКА ТЕКСТА
===================================================== */

async function sendMessage(){

    const text =
        input.value.trim();

    if(!text){
        return;
    }


    const selectedLanguage =
        language.value;

    const languageName =
        languageNames[selectedLanguage];


    addMessage(
        text,
        "user"
    );


    input.value = "";


    statusText.textContent =
        "Зея думает... 🧠";


    const loading =
        addMessage(
            "Зея печатает...",
            "bot loading"
        );


    try{

        const prompt =

            "Пользователь выбрал язык: " +
            languageName +
            ".\n\n" +

            "Отвечай строго на " +
            languageName +
            ".\n\n" +

            "Ты — Зея, личный AI-помощник.\n" +

            "Никогда не называй себя Теоманом.\n" +

            "Твоё имя — Зея.\n\n" +

            "Сообщение пользователя:\n" +
            text;


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                prompt

                        })

                }
            );


        const raw =
            await response.text();


        if(!response.ok){

            throw new Error(
                "Ошибка сервера " +
                response.status +
                ": " +
                raw
            );

        }


        let data;

        try{

            data =
                JSON.parse(raw);

        }catch{

            throw new Error(
                "Сервер вернул неправильный JSON."
            );

        }


        loading.remove();


        let answer =
            data.reply ||
            data.response ||
            data.message ||
            data.answer;


        if(
            typeof answer !==
            "string"
        ){

            answer =
                "Зея получила ответ от сервера, " +
                "но сервер вернул данные в неизвестном формате:\n\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                );

        }


        lastAnswer =
            answer;


        addMessage(
            answer,
            "bot"
        );


        speak(
            answer,
            selectedLanguage
        );


        statusText.textContent =
            "Онлайн 🟢";


    }catch(error){

        loading.remove();

        console.error(error);


        addMessage(
            "❌ Ошибка подключения:\n\n" +
            error.message,
            "error"
        );


        statusText.textContent =
            "Ошибка подключения 🔴";

    }

}



/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);



/* =====================================================
   ГОЛОС ЗЕИ
===================================================== */

function speak(text,lang){

    if(
        !(
            "speechSynthesis"
            in window
        )
    ){

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        lang ||
        language.value;


    speech.rate =
        0.95;

    speech.pitch =
        1;

    speech.volume =
        1;


    window.speechSynthesis.speak(
        speech
    );

}



/* =====================================================
   ПОВТОРИТЬ ПОСЛЕДНИЙ ОТВЕТ
===================================================== */

function speakLast(){

    if(!lastAnswer){

        addMessage(
            "Сначала поговори со мной 😊",
            "bot"
        );

        return;

    }


    speak(
        lastAnswer,
        language.value
    );

}



/* =====================================================
   ГОЛОСОВОЙ ВВОД
===================================================== */

function startVoice(){

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!Recognition){

        addMessage(
            "❌ Голосовой ввод не поддерживается этим браузером.",
            "error"
        );

        return;

    }


    const recognition =
        new Recognition();


    recognition.lang =
        language.value;


    recognition.interimResults =
        false;


    recognition.continuous =
        false;


    statusText.textContent =
        "Слушаю тебя... 🎙️";


    try{

        recognition.start();

    }catch(error){

        console.error(error);

    }


    recognition.onresult =
        function(event){

            const text =
                event
                    .results[0][0]
                    .transcript;


            input.value =
                text;


            sendMessage();

        };


    recognition.onerror =
        function(event){

            console.error(
                event.error
            );


            addMessage(
                "❌ Ошибка микрофона: " +
                event.error,
                "error"
            );


            statusText.textContent =
                "Готова помочь ✨";

        };


    recognition.onend =
        function(){

            statusText.textContent =
                "Готова помочь ✨";

        };

}



/* =====================================================
   КАМЕРА
===================================================== */

function openCamera(){

    const camera =
        document.createElement(
            "input"
        );


    camera.type =
        "file";


    camera.accept =
        "image/*";


    camera.capture =
        "environment";


    camera.onchange =
        async function(){

            if(
                !camera.files ||
                camera.files.length === 0
            ){

                return;

            }


            const file =
                camera.files[0];


            /* Показываем сообщение */

            addMessage(
                "📸 Фото получено.",
                "user"
            );


            statusText.textContent =
                "Зея анализирует фото... 🔍";


            const loading =
                addMessage(
                    "🔍 Анализирую изображение...",
                    "bot loading"
                );


            try{

                /*
                 * Читаем изображение
                 * как Base64
                 */

                const imageBase64 =
                    await fileToBase64(
                        file
                    );


                /*
                 * Отправляем изображение
                 * вместе с сообщением
                 */

                const response =
                    await fetch(
                        API_URL,
                        {

                            method:
                                "POST",

                            headers:{
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    message:
                                        "Проанализируй это изображение. " +
                                        "Опиши подробно, что на нём изображено. " +
                                        "Отвечай на русском языке.",

                                    image:
                                        imageBase64

                                })

                        }
                    );


                const raw =
                    await response.text();


                if(!response.ok){

                    throw new Error(
                        "Ошибка сервера " +
                        response.status +
                        ": " +
                        raw
                    );

                }


                let data;


                try{

                    data =
                        JSON.parse(raw);

                }catch{

                    throw new Error(
                        "Сервер вернул неправильный JSON."
                    );

                }


                loading.remove();


                /*
                 * Поддерживаем разные варианты
                 * ответа backend
                 */

                let answer =
                    data.reply ||
                    data.response ||
                    data.message ||
                    data.answer;


                /*
                 * Если API вернул ошибку
                 */

                if(
                    data.ok === false ||
                    data.error
                ){

                    throw new Error(
                        data.error ||
                        "Сервер не смог проанализировать фото."
                    );

                }


                /*
                 * Если текста нет
                 */

                if(
                    typeof answer !==
                    "string" ||
                    !answer.trim()
                ){

                    throw new Error(
                        "OpenAI не вернул текстовый ответ."
                    );

                }


                lastAnswer =
                    answer;


                addMessage(
                    "🖼️ " + answer,
                    "bot"
                );


                speak(
                    answer,
                    language.value
                );


                statusText.textContent =
                    "Онлайн 🟢";


            }catch(error){

                loading.remove();


                console.error(
                    "PHOTO ERROR:",
                    error
                );


                addMessage(
                    "❌ Не удалось проанализировать фото:\n\n" +
                    error.message,
                    "error"
                );


                statusText.textContent =
                    "Ошибка анализа 🔴";

            }

        };


    camera.click();

}



/* =====================================================
   FILE → BASE64
===================================================== */

function fileToBase64(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(){

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "Не удалось прочитать фотографию."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


</script>

</body>
</html>
