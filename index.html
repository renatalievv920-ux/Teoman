<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Теоман</title>
<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #070b14;
    --card: #101827;
    --card2: #172236;
    --border: #273652;
    --text: #f7f9ff;
    --muted: #8f9bb3;
    --blue: #4f7cff;
    --blue2: #315fe8;
    --green: #48d17a;
    --purple: #8757ff;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% -10%, #203d78 0%, transparent 38%),
        linear-gradient(180deg, #070b14 0%, #0b1120 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Segoe UI", Arial, sans-serif;
}

.container {
    width: min(900px, 100%);
    margin: auto;
    padding: 24px 18px 45px;
}

.header {
    text-align: center;
    padding: 28px 10px 22px;
}

.header h1 {
    margin: 0;
    font-size: clamp(30px, 8vw, 52px);
    font-weight: 800;
    letter-spacing: -1.5px;
}

.online {
    color: var(--green);
    font-size: 16px;
    font-weight: 600;
    margin-top: 9px;
}

.chat {
    background: rgba(16, 24, 39, .88);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 18px;
    min-height: 480px;
    max-height: 62vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    backdrop-filter: blur(18px);
}

.message {
    padding: 15px 18px;
    border-radius: 22px;
    margin: 12px 0;
    max-width: 88%;
    font-size: 18px;
    line-height: 1.5;
    white-space: pre-wrap;
    animation: messageIn .25s ease;
}

.user {
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    margin-left: auto;
    border-bottom-right-radius: 7px;
    box-shadow: 0 8px 25px rgba(63,102,235,.22);
}

.bot {
    background: var(--card2);
    margin-right: auto;
    border-bottom-left-radius: 7px;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}

input,
textarea {
    flex: 1;
    min-width: 0;
    background: rgba(16, 24, 39, .95);
    color: white;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 17px 19px;
    font-size: 17px;
    outline: none;
    transition: .2s;
}

input:focus,
textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(79,124,255,.12);
}

button {
    border: 0;
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, filter .15s;
}

button:active {
    transform: scale(.97);
}

.send {
    width: 58px;
    height: 58px;
    border-radius: 20px;
    background: linear-gradient(135deg, #5b83ff, #315fe8);
    font-size: 25px;
}

.controls {
    display: grid;
    gap: 12px;
    margin-top: 18px;
}

.controls button {
    width: 100%;
    min-height: 64px;
    border-radius: 22px;
    font-size: 19px;
}

.voice {
    background: linear-gradient(135deg, #54c96c, #3ba957);
}

.speak {
    background: linear-gradient(135deg, #8b55ff, #5b2dd8);
}

.clear {
    background: #202c42;
    color: #dbe3f4;
}

.status {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 12px 0;
}

.typing {
    display: inline-flex;
    gap: 5px;
    padding: 15px 18px;
    background: var(--card2);
    border-radius: 20px;
}

.typing span {
    width: 7px;
    height: 7px;
    background: #9aa7bf;
    border-radius: 50%;
    animation: bounce 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes bounce {
    0%, 60%, 100% {
        transform: translateY(0);
    }
    30% {
        transform: translateY(-5px);
    }
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    .container {
        padding: 12px 12px 30px;
    }

    .header {
        padding: 20px 5px 16px;
    }

    .chat {
        min-height: 52vh;
        border-radius: 25px;
        padding: 13px;
    }

    .message {
        font-size: 17px;
        max-width: 92%;
    }

    .controls button {
        min-height: 60px;
        font-size: 18px;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        🟢 Теоман Онлайн
        <div class="online">Готов тебя слушать</div>
    </div>
    <div id="chat" class="chat"></div>
    <div class="input-area">
        <input
            id="input"
            type="text"
            placeholder="Напиши Теоману..."
            autocomplete="off"
        >
        <button class="send" onclick="sendMessage()">➤</button>
    </div>
    <div id="status" class="status"></div>
    <button
        id="voiceButton"
        class="voice"
        onclick="startVoice()">
        🎙️ Говорить с Теоманом
    </button>
    <button
        class="speak"
        onclick="speakLastAnswer()">
        🔊 Озвучить последний ответ
    </button>
    <button
        class="clear"
        onclick="clearChat()">
        🧹 Очистить память
    </button>
</div>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const statusText = document.getElementById("status");
const voiceButton = document.getElementById("voiceButton");
let lastAnswer = "";
let recognition = null;
/* =========================
   ПАМЯТЬ ПЕРЕПИСКИ
========================= */
let memory = JSON.parse(
    localStorage.getItem("teoman_memory") || "[]"
);
function saveMemory() {
    localStorage.setItem(
        "teoman_memory",
        JSON.stringify(memory)
    );
}
/* =========================
   ПОКАЗ ЧАТА
========================= */
function addMessage(text, type) {
    const message = document.createElement("div");
    message.className =
        "message " + type;
    message.textContent = text;
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
}
/* =========================
   ЗАГРУЗКА ПАМЯТИ
========================= */
function loadMemory() {
    chat.innerHTML = "";
    if (memory.length === 0) {
        addMessage(
            "Привет! 👋 Я Теоман. Чем могу помочь?",
            "bot"
        );
        return;
    }
    for (const item of memory) {
        addMessage(
            item.text,
            item.role === "user"
                ? "user"
                : "bot"
        );
        if (item.role === "assistant") {
            lastAnswer = item.text;
        }
    }
}
loadMemory();
/* =========================
   ОТПРАВКА СООБЩЕНИЯ
========================= */
async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, "user");
    memory.push({
        role: "user",
        text: message
    });
    saveMemory();
    input.value = "";
    statusText.textContent =
        "Теоман думает... 🤖";
    try {
        const response = await fetch(
            "/api/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            }
        );
        if (!response.ok) {
            throw new Error(
                "Ошибка сервера: " +
                response.status
            );
        }
        const data =
            await response.json();
        const answer =
            data.reply || "Я не получил ответ.";
        lastAnswer = answer;
        addMessage(
            answer,
            "bot"
        );
        memory.push({
            role: "assistant",
            text: answer
        });
        saveMemory();
        statusText.textContent = "";
    } catch (error) {
        console.error(error);
        addMessage(
            "Не получилось связаться с сервером 😕",
            "bot"
        );
        statusText.textContent =
            "Ошибка соединения";
    }
}
/* =========================
   ENTER = ОТПРАВИТЬ
========================= */
input.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
);
/* =========================
   ГОЛОСОВОЙ ВВОД
========================= */
function startVoice() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert(
            "Голосовой ввод не поддерживается этим браузером."
        );
        return;
    }
    if (recognition) {
        recognition.stop();
        recognition = null;
        return;
    }
    recognition =
        new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onstart = function() {
        voiceButton.classList.add(
            "listening"
        );
        voiceButton.textContent =
            "🔴 Слушаю тебя...";
        statusText.textContent =
            "Говори...";
    };
    recognition.onresult =
        function(event) {
            const text =
                event.results[0][0]
                .transcript;
            input.value = text;
            voiceButton.classList.remove(
                "listening"
            );
            voiceButton.textContent =
                "🎙️ Говорить с Теоманом";
            statusText.textContent = "";
            recognition.stop();
            recognition = null;
            sendMessage();
        };
    recognition.onerror =
        function(event) {
            console.log(
                "Ошибка микрофона:",
                event.error
            );
            voiceButton.classList.remove(
                "listening"
            );
            voiceButton.textContent =
                "🎙️ Говорить с Теоманом";
            statusText.textContent =
                "Не удалось услышать голос";
            recognition = null;
        };
    recognition.onend = function() {
        voiceButton.classList.remove(
            "listening"
        );
        voiceButton.textContent =
            "🎙️ Говорить с Теоманом";
        recognition = null;
    };
    recognition.start();
}
/* =========================
   ОЗВУЧИВАНИЕ
========================= */
function speakLastAnswer() {
    if (!lastAnswer) {
        alert(
            "Пока нечего озвучивать."
        );
        return;
    }
    window.speechSynthesis.cancel();
    const speech =
        new SpeechSynthesisUtterance(
            lastAnswer
        );
    speech.lang = "ru-RU";
    speech.rate = 1;
    speech.pitch = 1;
    window.speechSynthesis.speak(
        speech
    );
}
/* =========================
   ОЧИСТКА ПАМЯТИ
========================= */
function clearChat() {
    window.speechSynthesis.cancel();
    memory = [];
    localStorage.removeItem(
        "teoman_memory"
    );
    lastAnswer = "";
    chat.innerHTML = "";
    addMessage(
        "Чат очищен 🧹\nЯ снова готов тебя слушать!",
        "bot"
    );
    statusText.textContent = "";
}
</script>
</body>
</html>
