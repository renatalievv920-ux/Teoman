<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Зея — AI помощник</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #070b16;
    color: white;
    font-family: Arial, sans-serif;
}

.app {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    margin: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.header {
    text-align: center;
    padding: 25px 0;
}

.logo {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    background: linear-gradient(135deg, #536dfe, #8e45e9);
    box-shadow: 0 0 50px rgba(91, 92, 255, .35);
}

h1 {
    margin: 25px 0 5px;
    font-size: 52px;
}

.status {
    color: #aaa;
    font-size: 22px;
}

.chat {
    flex: 1;
    padding: 10px 0 20px;
}

.message {
    padding: 20px;
    margin: 15px 0;
    border-radius: 25px;
    font-size: 21px;
    line-height: 1.45;
    white-space: pre-wrap;
}

.bot {
    background: #1b2948;
    border: 1px solid #31538d;
}

.user {
    background: linear-gradient(135deg, #49308b, #54309b);
    margin-left: 12%;
}

.error {
    background: #351d27;
    border: 1px solid #8c3047;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

button {
    width: 100%;
    min-height: 65px;
    border: 0;
    border-radius: 25px;
    color: white;
    font-size: 21px;
    font-weight: 500;
    background: #1b263d;
}

button:active {
    transform: scale(.98);
}

.camera {
    background: linear-gradient(135deg, #315eea, #7139e9);
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    height: 60px;
    border-radius: 20px;
    border: 1px solid #34425d;
    background: #111827;
    color: white;
    padding: 0 18px;
    font-size: 18px;
    outline: none;
}

.send {
    width: 70px;
    height: 60px;
    border-radius: 20px;
    background: #5435d9;
}

.loading {
    opacity: .7;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">🤖</div>

        <h1>Зея</h1>

        <div class="status" id="status">
            Готова помочь ✨
        </div>

    </div>

    <div class="chat" id="chat">

        <div class="message bot">
            Привет! Я Зея 🤖<br>
            Я готова тебе помочь.
        </div>

    </div>

    <div class="buttons">

        <button class="camera" onclick="openCamera()">
            📸 Камера
        </button>

        <button onclick="startVoice()">
            🎙️ Говорить с Зеей
        </button>

        <button onclick="speakLast()">
            🔊 Голос Зеи
        </button>

    </div>

    <div class="input-area">

        <input
            id="input"
            type="text"
            placeholder="Напиши Зее..."
            autocomplete="off"
        >

        <button class="send" onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>

<script>

const API_URL = "https://zeya-pi.vercel.app/api/chat";

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");

let lastAnswer = "";

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    return div;
}

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    statusText.textContent = "Зея думает...";

    const loading = addMessage("Зея печатает...", "bot loading");

    try {

        const response = await fetch(API_URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },

            body: JSON.stringify({
                message: text
            })
        });

        const raw = await response.text();

        if (!response.ok) {
            throw new Error(
                "Ошибка сервера " +
                response.status +
                ": " +
                raw
            );
        }

        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            throw new Error(
                "API вернул не JSON: " + raw
            );
        }

        loading.remove();

        let answer =
            data.answer ||
            data.response ||
            data.message ||
            data.reply;

        if (typeof answer !== "string") {

            answer = JSON.stringify(
                data,
                null,
                2
            );
        }

        lastAnswer = answer;

        addMessage(answer, "bot");

        statusText.textContent = "Онлайн 🟢";

    } catch (error) {

        loading.remove();

        console.error(error);

        addMessage(
            "❌ Не удалось подключиться к Зее.\n\n" +
            error.message,
            "error"
        );

        statusText.textContent = "Ошибка подключения 🔴";
    }
}

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        addMessage(
            "🎙️ Голосовой ввод не поддерживается этим браузером.",
            "error"
        );

        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "ru-RU";

    recognition.interimResults = false;

    recognition.continuous = false;

    statusText.textContent = "Слушаю тебя... 🎙️";

    recognition.start();

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        input.value = text;

        sendMessage();
    };

    recognition.onerror = function(event) {

        addMessage(
            "❌ Ошибка микрофона: " +
            event.error,
            "error"
        );

        statusText.textContent = "Готова помочь ✨";
    };

    recognition.onend = function() {

        statusText.textContent = "Готова помочь ✨";
    };
}

function speakLast() {

    if (!lastAnswer) {

        addMessage(
            "Пока Зея ещё ничего не ответила 😊",
            "bot"
        );

        return;
    }

    if (!("speechSynthesis" in window)) {

        addMessage(
            "🔊 Голосовая функция не поддерживается.",
            "error"
        );

        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(lastAnswer);

    speech.lang = "ru-RU";

    speech.rate = 1;

    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}

function openCamera() {

    const inputCamera =
        document.createElement("input");

    inputCamera.type = "file";

    inputCamera.accept = "image/*";

    inputCamera.capture = "environment";

    inputCamera.onchange = function() {

        if (inputCamera.files.length > 0) {

            addMessage(
                "📸 Фото получено. Анализ камеры добавим следующим шагом.",
                "bot"
            );
        }
    };

    inputCamera.click();
}

</script>

</body>
</html>
