<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Теоман — ИИ помощник</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: #0b1120;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}
.container {
    width: 100%;
    max-width: 760px;
    margin: auto;
    padding: 25px 18px;
}
.header {
    text-align: center;
    padding: 25px 0 20px;
}
.logo {
    font-size: 60px;
}
h1 {
    font-size: 48px;
    margin: 5px 0;
}
.subtitle {
    color: #94a3b8;
    font-size: 24px;
}
.online {
    color: #22c55e;
    font-size: 24px;
    margin-top: 35px;
}
.chat {
    background: #111827;
    border: 2px solid #263650;
    border-radius: 30px;
    padding: 22px;
    margin-top: 30px;
    min-height: 400px;
    max-height: 55vh;
    overflow-y: auto;
}
.message {
    padding: 18px 22px;
    border-radius: 25px;
    margin: 14px 0;
    font-size: 20px;
    line-height: 1.45;
}
.user {
    background: #2563eb;
    margin-left: 12%;
    text-align: right;
}
.bot {
    background: #1e293b;
    margin-right: 12%;
}
.controls {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}
input {
    flex: 1;
    background: #111827;
    border: 2px solid #334155;
    border-radius: 25px;
    padding: 20px;
    color: white;
    font-size: 20px;
    outline: none;
}
input::placeholder {
    color: #94a3b8;
}
button {
    border: none;
    border-radius: 22px;
    padding: 0 24px;
    font-size: 22px;
    font-weight: bold;
    color: white;
    cursor: pointer;
}
.send {
    background: #2563eb;
    width: 75px;
}
.voice {
    width: 100%;
    height: 70px;
    margin-top: 18px;
    background: #16a34a;
}
.speak {
    width: 100%;
    height: 65px;
    margin-top: 14px;
    background: #7c3aed;
}
.clear {
    width: 100%;
    height: 60px;
    margin-top: 14px;
    background: #334155;
}
button:active {
    transform: scale(0.98);
}
.listening {
    background: #dc2626 !important;
}
.status {
    text-align: center;
    color: #94a3b8;
    margin-top: 12px;
    min-height: 25px;
}
.footer {
    text-align: center;
    color: #64748b;
    margin-top: 30px;
    font-size: 16px;
}
@media (max-width: 600px) {
    h1 {
        font-size: 42px;
    }
    .logo {
        font-size: 50px;
    }
    .subtitle {
        font-size: 20px;
    }
    .chat {
        padding: 15px;
    }
    .message {
        font-size: 18px;
    }
    .user {
        margin-left: 5%;
    }
    .bot {
        margin-right: 5%;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">🤖</div>
        <h1>Теоман</h1>
        <div class="subtitle">Твой личный ИИ-помощник</div>
        <div class="online">● Теоман онлайн</div>
    </div>
    <div class="chat" id="chat">
        <div class="message bot">
            Привет! 👋 Я Теоман. Рад тебя видеть!
        </div>
    </div>
    <div class="controls">
        <input
            id="input"
            type="text"
            placeholder="Напиши Теоману..."
            autocomplete="off"
        >
        <button class="send" onclick="sendMessage()">➤</button>
    </div>
    <button
        class="voice"
        id="voiceButton"
        onclick="startVoice()">
        🎤 Говорить с Теоманом
    </button>
    <button
        class="speak"
        onclick="speakLast()">
        🔊 Озвучить последний ответ
    </button>
    <button
        class="clear"
        onclick="clearChat()">
        🗑️ Очистить чат
    </button>
    <div class="status" id="status"></div>
    <div class="footer">
        Теоман • версия 2.0
    </div>
</div>
<script>
let lastAnswer = "";
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const voiceButton = document.getElementById("voiceButton");
/* =========================
   ДОБАВЛЕНИЕ СООБЩЕНИЯ
========================= */
function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
}
/* =========================
   ОТВЕТ ТЕОМАНА
========================= */
function getAnswer(text) {
    const q = text.toLowerCase();
    if (q.includes("привет") || q.includes("здравствуй")) {
        return "Привет! 👋 Я Теоман. Чем могу помочь?";
    }
    if (q.includes("как дела")) {
        return "У меня всё отлично 🤖 Я онлайн и готов тебе помогать!";
    }
    if (q.includes("как тебя зовут")) {
        return "Меня зовут Теоман 🤖";
    }
    if (q.includes("который час") || q.includes("сколько сейчас времени")) {
        const now = new Date();
        return "Сейчас " +
            now.toLocaleTimeString("ru-RU", {
                hour: "2-digit",
                minute: "2-digit"
            });
    }
    if (q.includes("турци")) {
        return "Турция 🇹🇷 — прекрасная страна. Здесь есть море, красивые города, вкусная еда и много интересных мест!";
    }
    if (q.includes("спасибо")) {
        return "Пожалуйста! 😊";
    }
    if (q.includes("кто ты")) {
        return "Я Теоман 🤖 — твой личный ИИ-помощник.";
    }
    return "Я услышал тебя: «" + text +
        "». Сейчас я работаю в базовом режиме, но голос уже подключён 🔊🤖";
}
/* =========================
   ОТПРАВКА СООБЩЕНИЯ
========================= */
function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";
    statusText.textContent = "Теоман думает...";
    setTimeout(() => {
        const answer = getAnswer(text);
        lastAnswer = answer;
        addMessage(answer, "bot");
        statusText.textContent = "";
        // Автоматически говорим ответ
        speak(answer);
    }, 500);
}
/* =========================
   ENTER
========================= */
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
/* =========================
   ГОЛОС ТЕОМАНА
========================= */
function speak(text) {
    if (!window.speechSynthesis) {
        statusText.textContent =
            "Голос не поддерживается этим браузером";
        return;
    }
    window.speechSynthesis.cancel();
    const say = () => {
        const utterance =
            new SpeechSynthesisUtterance(text);
        utterance.lang = "ru-RU";
        utterance.rate = 0.9;
        utterance.pitch = 1;
        utterance.volume = 1;
        const voices =
            window.speechSynthesis.getVoices();
        const russianVoice =
            voices.find(v => v.lang === "ru-RU") ||
            voices.find(v => v.lang.startsWith("ru"));
        if (russianVoice) {
            utterance.voice = russianVoice;
        }
        utterance.onstart = function() {
            statusText.textContent = "🔊 Теоман говорит...";
        };
        utterance.onend = function() {
            statusText.textContent = "";
        };
        utterance.onerror = function() {
            statusText.textContent =
                "Не удалось запустить голос";
        };
        window.speechSynthesis.speak(utterance);
    };
    if (window.speechSynthesis.getVoices().length === 0) {
        window.speechSynthesis.onvoiceschanged =
            function() {
                window.speechSynthesis.onvoiceschanged = null;
                say();
            };
    } else {
        say();
    }
}
/* =========================
   ПОВТОРИТЬ ПОСЛЕДНИЙ ОТВЕТ
========================= */
function speakLast() {
    if (!lastAnswer) {
        speak("Пока нет ответа для озвучивания.");
        return;
    }
    speak(lastAnswer);
}
/* =========================
   ГОЛОСОВОЙ ВВОД
========================= */
let recognition = null;
function startVoice() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert(
            "Голосовой ввод не поддерживается этим браузером."
        );
        return;
    }
    if (recognition) {
        recognition.stop();
        return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onstart = function() {
        voiceButton.classList.add("listening");
        voiceButton.textContent =
            "🔴 Слушаю тебя...";
        statusText.textContent =
            "Говори...";
    };
    recognition.onresult = function(event) {
        const text =
            event.results[0][0].transcript;
        input.value = text;
        voiceButton.classList.remove("listening");
        voiceButton.textContent =
            "🎤 Говорить с Теоманом";
        statusText.textContent = "";
        sendMessage();
    };
    recognition.onerror = function(event) {
        console.log("Ошибка микрофона:", event.error);
        voiceButton.classList.remove("listening");
        voiceButton.textContent =
            "🎤 Говорить с Теоманом";
        statusText.textContent =
            "Не удалось услышать голос";
    };
    recognition.onend = function() {
        recognition = null;
        voiceButton.classList.remove("listening");
        voiceButton.textContent =
            "🎤 Говорить с Теоманом";
    };
    recognition.start();
}
/* =========================
   ОЧИСТИТЬ ЧАТ
========================= */
function clearChat() {
    window.speechSynthesis.cancel();
    chat.innerHTML = `
        <div class="message bot">
            Чат очищен 🧹<br>
            Я снова готов тебя слушать!
        </div>
    `;
    lastAnswer = "";
    statusText.textContent = "";
}
</script>
</body>
</html>
