<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зея — AI помощник</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #070b16;
    color: white;
    font-family: Arial, sans-serif;
}

.app {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    margin: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.header {
    text-align: center;
    padding: 20px 0;
}

.logo {
    width: 110px;
    height: 110px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(135deg,#4f7cff,#9b59ff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 55px;
    box-shadow: 0 0 45px rgba(90,120,255,.45);
}

h1 {
    font-size: 40px;
    margin: 12px 0 4px;
}

.status {
    color: #9ca3af;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px 0;
}

.message {
    max-width: 88%;
    padding: 15px 18px;
    margin: 10px 0;
    border-radius: 20px;
    font-size: 18px;
    line-height: 1.45;
    white-space: pre-wrap;
}

.zeia {
    background: #172642;
    border: 1px solid #294775;
}

.user {
    margin-left: auto;
    background: #422879;
}

.controls {
    display: grid;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 18px;
    padding: 16px;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.camera {
    background: linear-gradient(135deg,#2563eb,#7c3aed);
}

.voice {
    background: #1d293d;
}

.voice.listening {
    background: #991b1b;
}

.input {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 16px;
    border-radius: 18px;
    border: 1px solid #34445f;
    background: #101827;
    color: white;
    font-size: 17px;
    outline: none;
}

.send {
    width: 60px;
    background: #2563eb;
}

#cameraInput {
    display: none;
}

#photoArea {
    display: none;
    margin: 10px 0;
}

#photoPreview {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 18px;
    background: black;
}

.photoButtons {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.photoButtons button {
    flex: 1;
}

.analyze {
    background: #245b47;
}

.delete {
    background: #8f2222;
}

@media(max-width:500px) {
    .app {
        padding: 14px;
    }

    h1 {
        font-size: 34px;
    }

    .message {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">
            🤖
        </div>

        <h1>Зея</h1>

        <div
            class="status"
            id="status">
            Твой AI-помощник
        </div>

    </div>


    <div
        class="chat"
        id="chat">

        <div class="message zeia">
            Привет! Я Зея 🤖
            Я готова тебе помочь.
        </div>

    </div>


    <div
        id="photoArea">

        <img
            id="photoPreview"
            alt="Фото">

        <div class="photoButtons">

            <button
                class="analyze"
                onclick="analyzePhoto()">
                🔍 Анализировать
            </button>

            <button
                class="delete"
                onclick="deletePhoto()">
                🗑️ Удалить
            </button>

        </div>

    </div>


    <div class="controls">

        <button
            class="camera"
            onclick="openCamera()">
            📸 Камера
        </button>

        <button
            class="voice"
            id="voiceButton"
            onclick="startVoice()">
            🎙️ Говорить с Зеей
        </button>

        <button
            class="voice"
            onclick="toggleSpeech()">
            🔊 Голос Зеи
        </button>

    </div>


    <div class="input">

        <input
            id="messageInput"
            type="text"
            placeholder="Напиши Зее..."
            autocomplete="off">

        <button
            class="send"
            onclick="sendMessage()">
            ➤
        </button>

    </div>


    <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
        onchange="photoSelected(event)">

</div>


<script>

let speechEnabled = true;
let selectedPhoto = null;


/* =========================
   ЧАТ
========================= */

function addMessage(text, type) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   ОТПРАВКА СООБЩЕНИЯ
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) return;


    addMessage(
        text,
        "user"
    );

    input.value = "";


    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        "🧠 Зея думает...";


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.details ||
                "Ошибка API"
            );
        }


        const answer =
            data.reply ||
            data.response ||
            data.message;


        if (!answer) {

            throw new Error(
                "API не вернул ответ"
            );
        }


        addMessage(
            answer,
            "zeia"
        );


        speak(answer);


        status.textContent =
            "Твой AI-помощник";


    } catch (error) {

        console.error(error);


        addMessage(
            "❌ Ошибка подключения к AI:\n" +
            error.message,
            "zeia"
        );


        status.textContent =
            "Ошибка API";
    }
}


/* =========================
   ENTER
========================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {
                sendMessage();
            }

        }
    );


/* =========================
   ГОЛОСОВОЙ ОТВЕТ
========================= */

function toggleSpeech() {

    speechEnabled =
        !speechEnabled;


    const button =
        document.querySelectorAll(
            ".voice"
        )[1];


    if (speechEnabled) {

        button.textContent =
            "🔊 Голос Зеи";

        speak(
            "Голос Зеи включён."
        );

    } else {

        button.textContent =
            "🔇 Голос Зеи";

        speechSynthesis.cancel();
    }
}


function speak(text) {

    if (!speechEnabled) return;

    if (!window.speechSynthesis)
        return;


    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "ru-RU";

    speech.rate =
        0.95;

    speech.pitch =
        1.05;

    speech.volume =
        1;


    speechSynthesis.speak(
        speech
    );
}


/* =========================
   ГОЛОСОВОЙ ВВОД
========================= */

function startVoice() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!Recognition) {

        addMessage(
            "🎙️ Голосовой ввод не поддерживается этим браузером.",
            "zeia"
        );

        return;
    }


    const recognition =
        new Recognition();


    recognition.lang =
        "ru-RU";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    const button =
        document.getElementById(
            "voiceButton"
        );


    button.classList.add(
        "listening"
    );

    button.textContent =
        "🔴 Слушаю...";


    recognition.start();


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                .transcript;


            document
                .getElementById(
                    "messageInput"
                )
                .value =
                text;


            sendMessage();
        };


    recognition.onerror =
        function(event) {

            console.log(
                event.error
            );

            addMessage(
                "😔 Я не услышала тебя.",
                "zeia"
            );
        };


    recognition.onend =
        function() {

            button.classList.remove(
                "listening"
            );

            button.textContent =
                "🎙️ Говорить с Зеей";
        };
}


/* =========================
   КАМЕРА
========================= */

function openCamera() {

    document
        .getElementById(
            "cameraInput"
        )
        .click();
}


function photoSelected(event) {

    const file =
        event.target.files[0];

    if (!file) return;


    selectedPhoto =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            document
                .getElementById(
                    "photoPreview"
                )
                .src =
                e.target.result;


            document
                .getElementById(
                    "photoArea"
                )
                .style.display =
                "block";


            addMessage(
                "📸 Фото получено.",
                "zeia"
            );
        };


    reader.readAsDataURL(file);
}


/* =========================
   АНАЛИЗ ФОТО
========================= */

async function analyzePhoto() {

    if (!selectedPhoto) {

        addMessage(
            "Сначала сделай фото 📸",
            "zeia"
        );

        return;
    }


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "👁️ Зея смотрит на фото...";


    const reader =
        new FileReader();


    reader.onload =
        async function() {

            try {

                const response =
                    await fetch(
                        "/api/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                message:
                                    "Проанализируй это изображение. Опиши подробно, что на нём находится.",

                                image:
                                    reader.result
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Ошибка анализа"
                    );
                }


                const answer =
                    data.reply ||
                    data.response ||
                    data.message;


                addMessage(
                    answer ||
                    "Я не смогла проанализировать фото.",
                    "zeia"
                );


                if (answer)
                    speak(answer);


                status.textContent =
                    "Твой AI-помощник";


            } catch (error) {

                console.error(
                    error
                );


                addMessage(
                    "❌ Не удалось проанализировать фото:\n" +
                    error.message,
                    "zeia"
                );


                status.textContent =
                    "Ошибка анализа";
            }
        };


    reader.readAsDataURL(
        selectedPhoto
    );
}


/* =========================
   УДАЛЕНИЕ ФОТО
========================= */

function deletePhoto() {

    selectedPhoto =
        null;


    document
        .getElementById(
            "cameraInput"
        )
        .value = "";


    document
        .getElementById(
            "photoArea"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "photoPreview"
        )
        .src = "";
}

</script>

</body>
</html>
