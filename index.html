<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover">

<meta name="theme-color" content="#0b1020">

<title>Зея — AI Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at top,
            #293b68,
            #111827 45%,
            #05070d
        );

    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 92vh;

    padding: 24px;

    border-radius: 32px;

    background: rgba(10,17,35,.92);

    border: 1px solid rgba(255,255,255,.12);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);

    backdrop-filter: blur(25px);

    display: flex;
    flex-direction: column;
}

/* ЗАГОЛОВОК */

.header {
    text-align: center;
}

.logo {
    width: 90px;
    height: 90px;

    margin: auto;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 44px;

    background:
        linear-gradient(
            135deg,
            #60a5fa,
            #8b5cf6
        );

    box-shadow:
        0 0 40px rgba(96,165,250,.45);
}

h1 {
    margin: 14px 0 4px;
    font-size: 32px;
}

.status {
    color: #9ca3af;
    font-size: 14px;
}

/* ЧАТ */

.chat {
    flex: 1;

    min-height: 260px;
    max-height: 43vh;

    overflow-y: auto;

    padding: 15px 0;
}

.message {
    max-width: 86%;

    padding: 14px 17px;

    margin: 10px 0;

    border-radius: 20px;

    font-size: 17px;

    line-height: 1.45;

    word-wrap: break-word;
}

.message.zeia {
    margin-right: auto;

    background:
        rgba(65,105,170,.24);

    border:
        1px solid rgba(96,165,250,.25);
}

.message.user {
    margin-left: auto;

    background:
        rgba(124,58,237,.30);
}

/* КНОПКИ */

button {
    font-family: inherit;
    color: white;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

button:active {
    transform: scale(.96);
}

.camera-button {
    width: 100%;

    padding: 17px;

    margin-bottom: 10px;

    border: none;

    border-radius: 20px;

    font-size: 18px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );
}

.voice-enable {
    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border: none;

    border-radius: 16px;

    background: #172033;

    color: #cbd5e1;

    font-size: 15px;
}

.voice-button {
    width: 100%;

    padding: 17px;

    border-radius: 20px;

    font-size: 17px;

    border:
        1px solid rgba(255,255,255,.1);

    background: #202b3d;
}

.voice-button.active {
    background: #b91c1c;
}

.voice-button.speaking {
    background: #166534;
}

/* ФОТО */

#cameraInput {
    display: none;
}

.photo-box {
    display: none;

    margin: 10px 0 15px;

    text-align: center;
}

#preview {
    width: 100%;
    max-height: 330px;

    object-fit: contain;

    border-radius: 22px;

    background: black;
}

.photo-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.small-button {
    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 17px;

    background: #273449;

    font-size: 15px;
}

.delete-button {
    background: #7f1d1d;
}

/* ВВОД */

.input-row {
    display: flex;

    gap: 9px;

    margin-top: 10px;
}

input {
    flex: 1;

    min-width: 0;

    padding: 16px;

    border-radius: 18px;

    border:
        1px solid rgba(255,255,255,.1);

    outline: none;

    background: #111827;

    color: white;

    font-size: 16px;
}

input::placeholder {
    color: #64748b;
}

.send-button {
    width: 58px;

    border: none;

    border-radius: 18px;

    background: #2563eb;

    font-size: 23px;
}

.thinking {
    color: #93c5fd;

    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% {
        opacity: .4;
    }
}

@media (max-width:420px) {

    body {
        padding: 0;
    }

    .app {
        min-height: 100vh;
        border-radius: 0;
        border: none;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ЗЕЯ -->

    <div class="header">

        <div class="logo">
            🤖
        </div>

        <h1>Зея</h1>

        <div
            class="status"
            id="status">

            Твой AI-помощник

        </div>

    </div>


    <!-- ЧАТ -->

    <div
        class="chat"
        id="chat">

        <div class="message zeia">
            Привет! Я Зея 🤖<br>
            Я готова тебя слушать.
        </div>

    </div>


    <!-- ФОТО -->

    <div
        class="photo-box"
        id="photoBox">

        <img
            id="preview"
            alt="Фото">

        <div class="photo-buttons">

            <button
                class="small-button"
                onclick="analyzePhoto()">

                🔍 Анализировать

            </button>

            <button
                class="small-button delete-button"
                onclick="deletePhoto()">

                🗑️ Удалить

            </button>

        </div>

    </div>


    <!-- КАМЕРА -->

    <button
        class="camera-button"
        onclick="openCamera()">

        📸 Открыть камеру

    </button>


    <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
        onchange="photoSelected(event)">


    <!-- ГОЛОС -->

    <button
        class="voice-enable"
        onclick="enableVoice()">

        🔊 Включить голос Зеи

    </button>


    <button
        id="voiceButton"
        class="voice-button"
        onclick="startVoice()">

        🎙️ Говорить с Зеей

    </button>


    <!-- ТЕКСТ -->

    <div class="input-row">

        <input
            id="textInput"
            type="text"
            placeholder="Напиши Зее..."
            autocomplete="off"
            onkeydown="handleEnter(event)">

        <button
            class="send-button"
            onclick="sendMessage()">

            ➤

        </button>

    </div>

</div>


<script>

/* ======================================
   ПЕРЕМЕННЫЕ
====================================== */

let currentPhoto = null;

let voiceEnabled = false;

let conversation = [];


/* ======================================
   ДОБАВЛЕНИЕ СООБЩЕНИЯ
====================================== */

function addMessage(text, type) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;


    if (type === "zeia") {

        speak(text);

    }
}


/* ======================================
   ГОЛОС ЗЕИ
====================================== */

function enableVoice() {

    if (!("speechSynthesis" in window)) {

        alert(
            "Голосовая озвучка не поддерживается."
        );

        return;
    }

    const speech =
        new SpeechSynthesisUtterance(
            "Голос Зеи включён."
        );

    speech.lang = "ru-RU";
    speech.rate = 0.95;
    speech.pitch = 1.05;
    speech.volume = 1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(speech);

    voiceEnabled = true;

    document.getElementById("status")
        .innerText =
        "🔊 Голос Зеи включён";

    setTimeout(() => {

        document.getElementById("status")
            .innerText =
            "Твой AI-помощник";

    }, 2000);
}


/* ======================================
   ОЗВУЧКА ОТВЕТА
====================================== */

function speak(text) {

    if (!voiceEnabled) {
        return;
    }

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const cleanText =
        text
        .replace(/[^\p{L}\p{N}\s.,!?;:()\-]/gu, "")
        .trim();

    if (!cleanText) {
        return;
    }

    const speech =
        new SpeechSynthesisUtterance(
            cleanText
        );

    speech.lang = "ru-RU";

    speech.rate = 0.95;

    speech.pitch = 1.05;

    speech.volume = 1;

    const button =
        document.getElementById(
            "voiceButton"
        );

    speech.onstart = () => {

        button.classList.add(
            "speaking"
        );

    };

    speech.onend = () => {

        button.classList.remove(
            "speaking"
        );

    };

    window.speechSynthesis.speak(
        speech
    );
}


/* ======================================
   ОТПРАВКА В НАСТОЯЩИЙ API
====================================== */

async function sendMessage() {

    const input =
        document.getElementById(
            "textInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    /* Показываем вопрос */

    addMessage(
        text,
        "user"
    );

    input.value = "";


    /* Показываем статус */

    const status =
        document.getElementById(
            "status"
        );

    status.innerHTML =
        '<span class="thinking">' +
        '🧠 Зея думает...' +
        '</span>';


    try {

        /*
         * Отправляем сообщение
         * в твою папку /api
         */

        const response =
            await fetch("/api", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    message: text

                })

            });


        const data =
            await response.json();


        console.log(
            "Ответ API:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.details ||
                "Ошибка API"
            );

        }


        /*
         * Твой Python API
         * возвращает reply.
         */

        const answer =
            data.reply ||
            data.response ||
            data.message;


        if (!answer) {

            throw new Error(
                "API не вернул ответ."
            );

        }


        /* Сохраняем историю */

        conversation.push({

            role: "user",

            content: text

        });

        conversation.push({

            role: "assistant",

            content: answer

        });


        status.innerText =
            "Твой AI-помощник";


        /* Настоящий ответ Зеи */

        addMessage(
            answer,
            "zeia"
        );


    } catch (error) {

        console.error(
            "API ERROR:",
            error
        );


        status.innerText =
            "Ошибка подключения";


        addMessage(
            "Бро, я не смогла связаться с AI-мозгом 😔 Проверь API и OPENAI_API_KEY.",
            "zeia"
        );


        setTimeout(() => {

            status.innerText =
                "Твой AI-помощник";

        }, 3000);

    }
}


/* ======================================
   ENTER
====================================== */

function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }
}


/* ======================================
   ГОЛОСОВОЙ ВВОД
====================================== */

function startVoice() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!Recognition) {

        addMessage(
            "Голосовой ввод не поддерживается этим браузером.",
            "zeia"
        );

        return;
    }


    const recognition =
        new Recognition();


    recognition.lang =
        "ru-RU";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    const button =
        document.getElementById(
            "voiceButton"
        );


    button.classList.add(
        "active"
    );

    button.innerText =
        "🔴 Слушаю тебя...";


    recognition.start();


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                .transcript;


            /*
             * Показываем распознанный текст
             */

            document.getElementById(
                "textInput"
            ).value = text;


            /*
             * Отправляем его
             * настоящему AI
             */

            sendMessage();

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Voice error:",
                event.error
            );


            addMessage(
                "Я не смогла тебя услышать 🎙️ Попробуй ещё раз.",
                "zeia"
            );

        };


    recognition.onend =
        function() {

            button.classList.remove(
                "active"
            );

            button.innerText =
                "🎙️ Говорить с Зеей";

        };
}


/* ======================================
   КАМЕРА
====================================== */

function openCamera() {

    document
        .getElementById(
            "cameraInput"
        )
        .click();

}


/* ======================================
   ФОТО
====================================== */

function photoSelected(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    currentPhoto =
        file;


    const url =
        URL.createObjectURL(
            file
        );


    document
        .getElementById(
            "preview"
        )
        .src = url;


    document
        .getElementById(
            "photoBox"
        )
        .style.display =
        "block";


    addMessage(
        "📸 Фото получено. Я готова его посмотреть.",
        "zeia"
    );
}


/* ======================================
   АНАЛИЗ ФОТО
====================================== */

function analyzePhoto() {

    if (!currentPhoto) {

        addMessage(
            "Сначала сделай фотографию 📸",
            "zeia"
        );

        return;
    }


    addMessage(
        "🔍 Фото получено. Сейчас подключим настоящий анализ изображения.",
        "zeia"
    );

}


/* ======================================
   УДАЛИТЬ ФОТО
====================================== */

function deletePhoto() {

    currentPhoto =
        null;


    document
        .getElementById(
            "preview"
        )
        .src = "";


    document
        .getElementById(
            "photoBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "cameraInput"
        )
        .value = "";

}

</script>

</body>
</html>
