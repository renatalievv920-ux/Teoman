<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Зея — AI помощник</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#070b16;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
}

.header{
    text-align:center;
    padding:20px 0;
}

.logo{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
    background:linear-gradient(135deg,#536dfe,#8e45e9);
    box-shadow:0 0 50px rgba(91,92,255,.4);
}

h1{
    margin:18px 0 4px;
    font-size:46px;
}

.status{
    color:#aaa;
    font-size:18px;
}

.language{
    width:100%;
    margin-top:15px;
    padding:15px;
    border-radius:18px;
    border:1px solid #34425d;
    background:#111827;
    color:white;
    font-size:17px;
}

.chat{
    flex:1;
    padding:10px 0 20px;
}

.message{
    padding:17px;
    margin:12px 0;
    border-radius:22px;
    font-size:18px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.bot{
    background:#1b2948;
    border:1px solid #31538d;
}

.user{
    background:#49308b;
    margin-left:12%;
}

.error{
    background:#351d27;
    border:1px solid #8c3047;
}

.buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
}

button{
    width:100%;
    min-height:58px;
    border:0;
    border-radius:20px;
    color:white;
    font-size:18px;
    background:#1b263d;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.camera{
    background:linear-gradient(135deg,#315eea,#7139e9);
}

.input-area{
    display:flex;
    gap:9px;
    margin-top:12px;
}

input{
    flex:1;
    min-width:0;
    height:58px;
    border-radius:19px;
    border:1px solid #34425d;
    background:#111827;
    color:white;
    padding:0 16px;
    font-size:17px;
    outline:none;
}

.send{
    width:65px;
    background:#5435d9;
}

.loading{
    opacity:.7;
}

.preview{
    width:100%;
    max-height:350px;
    object-fit:contain;
    border-radius:20px;
    margin-top:10px;
    border:1px solid #31538d;
}

</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">
            🤖
        </div>

        <h1>
            Зея
        </h1>

        <div class="status" id="status">
            Готова помочь ✨
        </div>

        <select
            id="language"
            class="language"
        >

            <option value="ru-RU">
                🇷🇺 Русский
            </option>

            <option value="tr-TR">
                🇹🇷 Türkçe
            </option>

            <option value="en-US">
                🇬🇧 English
            </option>

            <option value="de-DE">
                🇩🇪 Deutsch
            </option>

            <option value="fr-FR">
                🇫🇷 Français
            </option>

            <option value="es-ES">
                🇪🇸 Español
            </option>

            <option value="it-IT">
                🇮🇹 Italiano
            </option>

            <option value="ar-SA">
                🇸🇦 العربية
            </option>

            <option value="zh-CN">
                🇨🇳 中文
            </option>

            <option value="ja-JP">
                🇯🇵 日本語
            </option>

        </select>

    </div>


    <div
        class="chat"
        id="chat"
    >

        <div
            class="message bot"
            id="welcome"
        >
            Привет! Я Зея 🤖
            Я готова тебе помочь.
        </div>

    </div>


    <div class="buttons">

        <button
            class="camera"
            onclick="openCamera()"
        >
            📸 Камера
        </button>

        <button
            onclick="startVoice()"
        >
            🎙️ Говорить с Зеей
        </button>

        <button
            onclick="speakLast()"
        >
            🔊 Голос Зеи
        </button>

    </div>


    <div class="input-area">

        <input
            id="input"
            type="text"
            placeholder="Напиши Зее..."
            autocomplete="off"
        >

        <button
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>


/* =========================
   API
========================= */

const API_URL =
    "https://zeya-pi.vercel.app/api/chat";


/* =========================
   ELEMENTS
========================= */

const input =
    document.getElementById("input");

const chat =
    document.getElementById("chat");

const statusText =
    document.getElementById("status");

const language =
    document.getElementById("language");


/* =========================
   ПЕРЕМЕННЫЕ
========================= */

let lastAnswer = "";


/* =========================
   ЯЗЫКИ
========================= */

const languageNames = {

    "ru-RU":
        "русском",

    "tr-TR":
        "турецком",

    "en-US":
        "английском",

    "de-DE":
        "немецком",

    "fr-FR":
        "французском",

    "es-ES":
        "испанском",

    "it-IT":
        "итальянском",

    "ar-SA":
        "арабском",

    "zh-CN":
        "китайском",

    "ja-JP":
        "японском"

};


/* =========================
   ИЗМЕНЕНИЕ ЯЗЫКА
========================= */

language.addEventListener(
    "change",
    function(){

        const lang =
            language.value;

        const name =
            languageNames[lang];

        addMessage(
            "🌐 Язык изменён. Теперь отвечаю на " +
            name +
            ".",
            "bot"
        );

        input.placeholder =
            getPlaceholder(lang);

    }
);


/* =========================
   PLACEHOLDER
========================= */

function getPlaceholder(lang){

    const placeholders = {

        "ru-RU":
            "Напиши Зее...",

        "tr-TR":
            "Zeya'ya yaz...",

        "en-US":
            "Write to Zeya...",

        "de-DE":
            "Schreibe Zeya...",

        "fr-FR":
            "Écris à Zeya...",

        "es-ES":
            "Escribe a Zeya...",

        "it-IT":
            "Scrivi a Zeya...",

        "ar-SA":
            "اكتب إلى زيا...",

        "zh-CN":
            "给泽娅写消息...",

        "ja-JP":
            "ゼヤにメッセージ..."

    };

    return placeholders[lang] ||
        "Напиши Зее...";
}


/* =========================
   СООБЩЕНИЯ
========================= */

function addMessage(
    text,
    type
){

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

    return div;
}


/* =========================
   ОБЩИЙ ПРОМПТ
========================= */

function createPrompt(text){

    const selectedLanguage =
        language.value;

    const languageName =
        languageNames[selectedLanguage];

    return (

        "Пользователь выбрал язык: " +
        languageName +
        ". " +

        "Отвечай пользователю строго на " +
        languageName +
        ". " +

        "Ты — Зея, личный AI-помощник. " +

        "Не называй себя Теоманом. " +

        "Отвечай естественно, дружелюбно и понятно. " +

        "Сообщение пользователя: " +
        text

    );
}


/* =========================
   ОТПРАВКА ТЕКСТА
========================= */

async function sendMessage(){

    const text =
        input.value.trim();

    if(!text){
        return;
    }


    const selectedLanguage =
        language.value;


    addMessage(
        text,
        "user"
    );


    input.value = "";


    statusText.textContent =
        "Зея думает...";


    const loading =
        addMessage(
            "Зея печатает...",
            "bot loading"
        );


    try{

        const prompt =
            createPrompt(text);


        const response =
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                prompt

                        })

                }
            );


        const raw =
            await response.text();


        if(!response.ok){

            throw new Error(
                "Ошибка сервера " +
                response.status +
                ": " +
                raw
            );

        }


        let data;

        try{

            data =
                JSON.parse(raw);

        }catch{

            throw new Error(
                "API вернул неправильный ответ."
            );

        }


        loading.remove();


        let answer =
            data.reply ||
            data.response ||
            data.message ||
            data.answer;


        if(typeof answer !== "string"){

            answer =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        }


        lastAnswer =
            answer;


        addMessage(
            answer,
            "bot"
        );


        speak(
            answer,
            selectedLanguage
        );


        statusText.textContent =
            "Онлайн 🟢";


    }catch(error){

        loading.remove();

        console.error(error);


        addMessage(
            "❌ Ошибка подключения:\n" +
            error.message,
            "error"
        );


        statusText.textContent =
            "Ошибка подключения 🔴";

    }

}


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            sendMessage();

        }

    }
);


/* =========================
   ГОЛОС ЗЕИ
========================= */

function speak(
    text,
    lang
){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        lang || language.value;


    speech.rate =
        0.95;


    speech.pitch =
        1;


    speech.volume =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


/* =========================
   ПОСЛЕДНИЙ ОТВЕТ
========================= */

function speakLast(){

    if(!lastAnswer){

        addMessage(
            "Сначала поговори со мной 😊",
            "bot"
        );

        return;

    }


    speak(
        lastAnswer,
        language.value
    );

}


/* =========================
   ГОЛОСОВОЙ ВВОД
========================= */

function startVoice(){

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!Recognition){

        addMessage(
            "🎙️ Голосовой ввод не поддерживается этим браузером.",
            "error"
        );

        return;

    }


    const recognition =
        new Recognition();


    recognition.lang =
        language.value;


    recognition.interimResults =
        false;


    recognition.continuous =
        false;


    statusText.textContent =
        "Слушаю тебя... 🎙️";


    recognition.start();


    recognition.onresult =
        function(event){

            const text =
                event.results[0][0]
                    .transcript;


            input.value =
                text;


            sendMessage();

        };


    recognition.onerror =
        function(event){

            addMessage(
                "❌ Ошибка микрофона: " +
                event.error,
                "error"
            );


            statusText.textContent =
                "Готова помочь ✨";

        };


    recognition.onend =
        function(){

            statusText.textContent =
                "Готова помочь ✨";

        };

}


/* =========================
   КАМЕРА
========================= */

function openCamera(){

    const camera =
        document.createElement("input");


    camera.type =
        "file";


    camera.accept =
        "image/*";


    camera.capture =
        "environment";


    camera.onchange =
        async function(){

            if(
                !camera.files ||
                !camera.files.length
            ){
                return;
            }


            const file =
                camera.files[0];


            statusText.textContent =
                "Зея смотрит на фото... 👀";


            addMessage(
                "📸 Фото получено.",
                "user"
            );


            const loading =
                addMessage(
                    "🔍 Зея анализирует изображение...",
                    "bot loading"
                );


            try{

                /*
                 * Превращаем фотографию
                 * в Data URL / Base64
                 */

                const image =
                    await fileToDataURL(
                        file
                    );


                const selectedLanguage =
                    language.value;


                const languageName =
                    languageNames[
                        selectedLanguage
                    ];


                const prompt =

                    "Пользователь выбрал язык: " +
                    languageName +
                    ". " +

                    "Ты — Зея, личный AI-помощник. " +

                    "Пользователь отправил тебе фотографию. " +

                    "Внимательно проанализируй изображение. " +

                    "Опиши, что на нём находится. " +

                    "Если на фотографии есть текст, " +
                    "прочитай и объясни его. " +

                    "Если видишь предмет, человека, животное, " +
                    "место или другую сцену — опиши её. " +

                    "Не придумывай то, чего не видно. " +

                    "Ответь пользователю строго на " +
                    languageName +
                    ".";


                const response =
                    await fetch(
                        API_URL,
                        {

                            method:"POST",

                            headers:{

                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"

                            },


                            body:
                                JSON.stringify({

                                    message:
                                        prompt,

                                    image:
                                        image

                                })

                        }
                    );


                const raw =
                    await response.text();


                if(!response.ok){

                    throw new Error(
                        "Ошибка сервера " +
                        response.status +
                        ": " +
                        raw
                    );

                }


                let data;


                try{

                    data =
                        JSON.parse(raw);

                }catch{

                    throw new Error(
                        "API вернул неправильный ответ."
                    );

                }


                loading.remove();


                let answer =
                    data.reply ||
                    data.response ||
                    data.message ||
                    data.answer;


                if(
                    typeof answer !== "string"
                ){

                    answer =
                        JSON.stringify(
                            data,
                            null,
                            2
                        );

                }


                lastAnswer =
                    answer;


                addMessage(
                    answer,
                    "bot"
                );


                speak(
                    answer,
                    selectedLanguage
                );


                statusText.textContent =
                    "Фото проанализировано 🟢";


            }catch(error){

                loading.remove();


                console.error(error);


                addMessage(
                    "❌ Не удалось проанализировать фото:\n" +
                    error.message,
                    "error"
                );


                statusText.textContent =
                    "Ошибка анализа 🔴";

            }

        };


    camera.click();

}


/* =========================
   FILE → DATA URL
========================= */

function fileToDataURL(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(){

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "Не удалось прочитать фотографию."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}

</script>

</body>
</html>
