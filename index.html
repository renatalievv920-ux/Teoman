<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b18"> 
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зея">
<title>Зея — ИИ помощник</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  min-height: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  color: #fff;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(
      circle at 50% -10%,
      #3655a0 0%,
      #172341 25%,
      #090e1d 60%,
      #040711 100%
    );
  overflow-x: hidden;
}
body::before,
body::after {
  content: "";
  position: fixed;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .18;
  pointer-events: none;
  z-index: -1;
}
body::before {
  background: #4169e1;
  top: 15%;
  left: -130px;
}
body::after {
  background: #8a4dff;
  right: -130px;
  bottom: 15%;
}
.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 20px 14px 40px;
}
.header {
  text-align: center;
  margin: 5px 0 22px;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: .3px;
  text-shadow:
    0 0 20px rgba(90,130,255,.35);
}
.robot {
  width: 76px;
  height: 76px;
  margin: 0 auto 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background:
    linear-gradient(
      145deg,
      #263d78,
      #111b37
    );
  border: 1px solid rgba(130,160,255,.45);
  box-shadow:
    0 0 30px rgba(75,110,255,.4),
    inset 0 0 25px rgba(100,140,255,.12);
  font-size: 42px;
  animation: robotFloat 3s ease-in-out infinite;
}
@keyframes robotFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-5px);
  }
}
.online {
  margin-top: 7px;
  color: #5cff91;
  font-size: 17px;
  font-weight: 700;
  text-shadow:
    0 0 14px rgba(92,255,145,.45);
}
.online::before {
  content: "";
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 7px;
  border-radius: 50%;
  background: #4dff79;
  box-shadow:
    0 0 12px #4dff79;
  animation: pulse 1.6s infinite;
}
@keyframes pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: .45;
    transform: scale(.75);
  }
}
.chat {
  min-height: 460px;
  max-height: 62vh;
  overflow-y: auto;
  padding: 18px;
  border-radius: 30px;
  background:
    linear-gradient(
      145deg,
      rgba(19,30,56,.9),
      rgba(8,14,29,.88)
    );
  border: 1px solid rgba(115,145,220,.35);
  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    inset 0 0 45px rgba(70,100,180,.08);
  backdrop-filter: blur(20px);
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar {
  width: 5px;
}
.chat::-webkit-scrollbar-thumb {
  background: #405581;
  border-radius: 10px;
}
.message {
  max-width: 88%;
  padding: 16px 19px;
  margin: 13px 0;
  border-radius: 22px;
  font-size: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
  animation: messageAppear .3s ease;
}
@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.bot {
  margin-right: auto;
  background:
    linear-gradient(
      145deg,
      #1b2b4b,
      #141f37
    );
  border: 1px solid rgba(88,120,180,.45);
  box-shadow:
    0 8px 25px rgba(0,0,0,.25);
}
.user {
  margin-left: auto;
  background:
    linear-gradient(
      145deg,
      #4169e1,
      #617fff
    );
  border: 1px solid rgba(150,170,255,.25);
  box-shadow:
    0 8px 28px rgba(50,85,220,.3);
}
.typing {
  display: none;
  width: fit-content;
  padding: 11px 16px;
  margin: 10px 0;
  border-radius: 18px;
  background: #18243d;
  border: 1px solid #2d4167;
  color: #91a0ba;
  font-size: 15px;
}
.typing span {
  display: inline-block;
  margin: 0 2px;
  animation: blink 1.4s infinite;
}
.typing span:nth-child(2) {
  animation-delay: .2s;
}
.typing span:nth-child(3) {
  animation-delay: .4s;
}
@keyframes blink {
  0%, 60%, 100% {
    opacity: .25;
  }
  30% {
    opacity: 1;
  }
}
.input-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
input {
  min-width: 0;
  flex: 1;
  padding: 18px 20px;
  border-radius: 23px;
  border: 1px solid #354b73;
  background:
    rgba(10,17,34,.94);
  color: white;
  font-size: 18px;
  outline: none;
  box-shadow:
    inset 0 0 20px rgba(0,0,0,.2);
  transition:
    border .2s ease,
    box-shadow .2s ease;
}
input::placeholder {
  color: #8992a5;
}
input:focus {
  border-color: #6384ff;
  box-shadow:
    0 0 0 3px rgba(80,110,255,.12),
    0 0 28px rgba(70,100,255,.18);
}
.send {
  flex: 0 0 68px;
  border: none;
  border-radius: 23px;
  background:
    linear-gradient(
      145deg,
      #4169e1,
      #6682ff
    );
  color: white;
  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
  box-shadow:
    0 8px 28px rgba(55,90,220,.38);
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}
.send:hover {
  box-shadow:
    0 10px 35px rgba(65,105,225,.55);
}
.send:active {
  transform: scale(.93);
}
.buttons {
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin-top: 16px;
}
button {
  width: 100%;
  min-height: 60px;
  border: none;
  border-radius: 20px;
  color: white;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition:
    transform .15s ease,
    filter .15s ease,
    box-shadow .15s ease;
}
button:hover {
  filter: brightness(1.08);
}
button:active {
  transform: scale(.97);
}
.voice {
  background:
    linear-gradient(
      135deg,
      #32b94f,
      #69dc63
    );
  box-shadow:
    0 8px 25px rgba(50,190,75,.25);
}
.voice.listening {
  background:
    linear-gradient(
      135deg,
      #e53935,
      #ff6b6b
    );
  animation:
    listeningPulse 1s infinite;
}
@keyframes listeningPulse {
  0%, 100% {
    box-shadow:
      0 0 0 rgba(255,70,70,0);
  }
  50% {
    box-shadow:
      0 0 28px rgba(255,70,70,.55);
  }
}
.speak {
  background:
    linear-gradient(
      135deg,
      #6735dc,
      #854cff
    );
  box-shadow:
    0 8px 25px rgba(110,55,230,.25);
}
.clear {
  background:
    linear-gradient(
      135deg,
      #26344d,
      #34445f
    );
  box-shadow:
    0 8px 20px rgba(0,0,0,.2);
}
.status {
  min-height: 22px;
  margin-top: 10px;
  text-align: center;
  color: #91a0ba;
  font-size: 15px;
}
@media (max-width: 600px) {
  .container {
    padding:
      12px
      12px
      30px;
  }
  .header {
    font-size: 27px;
    margin-top: 2px;
  }
  .robot {
    width: 68px;
    height: 68px;
    font-size: 38px;
  }
  .online {
    font-size: 16px;
  }
  .chat {
    min-height: 470px;
    max-height: 58vh;
    border-radius: 27px;
    padding: 14px;
  }
  .message {
    max-width: 92%;
    font-size: 17px;
    padding:
      15px
      17px;
  }
  input {
    font-size: 17px;
    padding: 17px;
  }
  .send {
    flex-basis: 62px;
    border-radius: 21px;
  }
  button {
    min-height: 62px;
    font-size: 18px;
  }
}
@media (max-width: 380px) {
  .container {
    padding-left: 9px;
    padding-right: 9px;
  }
  .chat {
    min-height: 430px;
  }
  .message {
    font-size: 16px;
  }
  input {
    font-size: 16px;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="robot">
      🤖
    </div>
    Зея
    <div class="online">
      Готова тебя слушать
    </div>
  </div>
  <div class="chat" id="chat">
    <div class="typing" id="typing">
      Зея печатает
      <span>•</span>
      <span>•</span>
      <span>•</span>
    </div>
  </div>
  <div class="input-row">
    <input
      id="input"
      type="text"
      placeholder="Напиши Зее..."
      autocomplete="off"
    >
    <button
      class="send"
      onclick="sendMessage()"
      aria-label="Отправить"
    >
      ➤
    </button>
  </div>
  <div
    class="status"
    id="status"
  ></div>
  <div class="buttons">
    <button
      id="voiceButton"
      class="voice"
      onclick="startVoice()"
    >
      🎙️ Говорить с Зеей
    </button>
    <button
      class="speak"
      onclick="speakLastAnswer()"
    >
      🔊 Озвучить последний ответ
    </button>
    <button
      class="clear"
      onclick="clearChat()"
    >
      🧹 Очистить память
    </button>
  </div>
</div>
<script>
/* ЭЛЕМЕНТЫ */
const chat =
  document.getElementById("chat");
const input =
  document.getElementById("input");
const statusText =
  document.getElementById("status");
const voiceButton =
  document.getElementById("voiceButton");
const typing =
  document.getElementById("typing");
let lastAnswer = "";
let recognition = null;
/* ПАМЯТЬ */
let memory = JSON.parse(
  localStorage.getItem("teoman_memory") || "[]"
);
function saveMemory() {
  localStorage.setItem(
    "teoman_memory",
    JSON.stringify(memory)
  );
}
/* ПОКАЗ СООБЩЕНИЯ */
function addMessage(text, type) {
  const message =
    document.createElement("div");
  message.className =
    "message " + type;
  message.textContent = text;
  chat.insertBefore(
    message,
    typing
  );
  chat.scrollTop =
    chat.scrollHeight;
}
/* ЗАГРУЗКА ПАМЯТИ */
function loadMemory() {
  chat.innerHTML = "";
  chat.appendChild(typing);
  if (memory.length === 0) {
    addMessage(
      "Привет! 👋 Я Зея. Чем могу помочь?",
      "bot"
    );
    return;
  }
  for (const item of memory) {
    addMessage(
      item.text,
      item.role === "user"
        ? "user"
        : "bot"
    );
    if (
      item.role === "assistant"
    ) {
      lastAnswer =
        item.text;
    }
  }
}
loadMemory();
/* ИНДИКАТОР ПЕЧАТАНИЯ */
function showTyping() {
  typing.style.display =
    "block";
  chat.scrollTop =
    chat.scrollHeight;
}
function hideTyping() {
  typing.style.display =
    "none";
}
/* ОТПРАВКА */
async function sendMessage() {
  const message =
    input.value.trim();
  if (!message) return;
  addMessage(
    message,
    "user"
  );
  memory.push({
    role: "user",
    text: message
  });
  saveMemory();
  input.value = "";
  statusText.textContent =
    "Зея думает... 🤖";
  showTyping();
  try {
    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              message: message
            })
        }
      );
    if (!response.ok) {
      throw new Error(
        "Ошибка сервера: " +
        response.status
      );
    }
    const data =
      await response.json();
    const answer =
      data.reply ||
      "Я не получила ответ.";
    hideTyping();
    lastAnswer =
      answer;
    addMessage(
      answer,
      "bot"
    );
    memory.push({
      role: "assistant",
      text: answer
    });
    saveMemory();
    statusText.textContent =
      "Готова тебя слушать";
  } catch (error) {
    console.error(error);
    hideTyping();
    addMessage(
      "Не получилось связаться с сервером 😕",
      "bot"
    );
    statusText.textContent =
      "Ошибка соединения";
  }
}
/* ENTER */
input.addEventListener(
  "keydown",
  function(event) {
    if (
      event.key === "Enter"
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/* ГОЛОСОВОЙ ВВОД */
function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert(
      "Голосовой ввод не поддерживается этим браузером."
    );
    return;
  }
  if (recognition) {
    recognition.stop();
    recognition = null;
    return;
  }
  recognition =
    new SpeechRecognition();
  recognition.lang =
    "ru-RU";
  recognition.continuous =
    false;
  recognition.interimResults =
    false;
  recognition.onstart =
    function() {
      voiceButton.classList.add(
        "listening"
      );
      voiceButton.textContent =
        "🔴 Слушаю тебя...";
      statusText.textContent =
        "Говори...";
    };
  recognition.onresult =
    function(event) {
      const text =
        event.results[0][0]
          .transcript;
      input.value =
        text;
      voiceButton.classList.remove(
        "listening"
      );
      voiceButton.textContent =
        "🎙️ Говорить с Зеей";
      statusText.textContent =
        "";
      recognition.stop();
      recognition = null;
      sendMessage();
    };
  recognition.onerror =
    function(event) {
      console.log(
        "Ошибка микрофона:",
        event.error
      );
      voiceButton.classList.remove(
        "listening"
      );
      voiceButton.textContent =
        "🎙️ Говорить с Зеей";
      statusText.textContent =
        "Не удалось услышать голос";
      recognition = null;
    };
  recognition.onend =
    function() {
      voiceButton.classList.remove(
        "listening"
      );
      voiceButton.textContent =
        "🎙️ Говорить с Зеей";
      recognition = null;
    };
  recognition.start();
}
/* ОЗВУЧКА */
function speakLastAnswer() {
  if (!lastAnswer) {
    alert(
      "Пока нечего озвучивать."
    );
    return;
  }
  if (!window.speechSynthesis) {
    alert(
      "Озвучивание не поддерживается."
    );
    return;
  }
  window.speechSynthesis.cancel();
  const speech =
    new SpeechSynthesisUtterance(
      lastAnswer
    );
  speech.lang =
    "ru-RU";
  speech.rate =
    0.95;
  speech.pitch =
    1.15;
  /*
    Браузер выбирает доступный
    русский голос.
    Если на устройстве есть
    женский русский голос,
    стараемся выбрать его.
  */
  function selectFemaleVoice() {
    const voices =
      window.speechSynthesis
        .getVoices();
    const femaleVoice =
      voices.find(
        voice =>
          voice.lang
            .toLowerCase()
            .startsWith("ru") &&
          (
            voice.name
              .toLowerCase()
              .includes("female") ||
            voice.name
              .toLowerCase()
              .includes("жен") ||
            voice.name
              .toLowerCase()
              .includes("milena") ||
            voice.name
              .toLowerCase()
              .includes("alena") ||
            voice.name
              .toLowerCase()
              .includes("yuri")
          )
      );
    if (femaleVoice) {
      speech.voice =
        femaleVoice;
    }
    window.speechSynthesis
      .speak(speech);
  }
  /*
    На некоторых телефонах
    голоса загружаются
    с небольшой задержкой.
  */
  const voices =
    window.speechSynthesis
      .getVoices();
  if (voices.length) {
    selectFemaleVoice();
  } else {
    window.speechSynthesis
      .addEventListener(
        "voiceschanged",
        selectFemaleVoice,
        { once: true }
      );
  }
}
/* ОЧИСТКА ПАМЯТИ */
function clearChat() {
  window.speechSynthesis.cancel();
  memory = [];
  localStorage.removeItem(
    "teoman_memory"
  );
  lastAnswer = "";
  chat.innerHTML = "";
  chat.appendChild(
    typing
  );
  addMessage(
    "Чат очищен 🧹\nЯ снова готова тебя слушать!",
    "bot"
  );
  statusText.textContent =
    "Память очищена";
}
/* ФОКУС */
input.focus();
</script>
</body>
</html>
