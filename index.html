<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зея — AI-помощник</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #26396b 0%, #0b1124 45%, #050812 100%);
      color: white;
      padding: 20px 14px;
    }

    .app {
      max-width: 650px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 25px 0 20px;
    }

    .avatar {
      width: 130px;
      height: 130px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #7198ff, #9b68ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 65px;
      box-shadow: 0 0 45px rgba(100, 120, 255, .35);
    }

    h1 {
      font-size: 48px;
      margin: 18px 0 4px;
    }

    .subtitle {
      color: #aeb7ca;
      font-size: 22px;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }

    .message {
      padding: 18px 20px;
      border-radius: 25px;
      font-size: 21px;
      line-height: 1.45;
      max-width: 90%;
      white-space: pre-wrap;
    }

    .zeia {
      align-self: flex-start;
      background: #1c2d50;
      border: 1px solid #31548b;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #39226f, #332061);
    }

    .buttons {
      display: grid;
      gap: 14px;
      margin-top: 25px;
    }

    button {
      border: 0;
      border-radius: 24px;
      padding: 20px;
      font-size: 21px;
      color: white;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .camera {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    .voice {
      background: #202b3d;
      border: 1px solid #3b475c;
    }

    .send {
      background: #2563eb;
      width: 70px;
      padding: 15px;
      font-size: 30px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      min-width: 0;
      border-radius: 22px;
      border: 1px solid #33415c;
      background: #111a2d;
      color: white;
      padding: 18px;
      font-size: 19px;
      outline: none;
    }

    #photoInput {
      display: none;
    }

    #photoPreview {
      display: none;
      margin-top: 15px;
      border-radius: 25px;
      overflow: hidden;
      background: #111827;
    }

    #photoPreview img {
      display: block;
      width: 100%;
      max-height: 500px;
      object-fit: contain;
    }

    .photo-buttons {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .analyze {
      background: #26364f;
    }

    .delete {
      background: #a91f2b;
    }

    .status {
      text-align: center;
      color: #9da9bd;
      margin-top: 15px;
      min-height: 25px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 19px;
      }

      .message {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="avatar">🤖</div>
    <h1>Зея</h1>
    <div class="subtitle">Твой AI-помощник</div>
  </div>

  <div id="chat">
    <div class="message zeia">
      Привет! Я Зея 🤖<br>
      Я готова тебя слушать 😊
    </div>
  </div>

  <div class="status" id="status"></div>

  <div id="photoPreview">
    <img id="photo" alt="Фото">
  </div>

  <div class="photo-buttons" id="photoButtons">
    <button class="analyze" onclick="analyzePhoto()">
      🔍 Анализировать
    </button>

    <button class="delete" onclick="deletePhoto()">
      🗑️ Удалить
    </button>
  </div>

  <div class="buttons">

    <button class="camera" onclick="openCamera()">
      📸 Открыть камеру
    </button>

    <button class="voice" onclick="toggleVoice()">
      🔊 Включить голос Зеи
    </button>

    <button class="voice" onclick="startListening()">
      🎙️ Говорить с Зеей
    </button>

  </div>

  <div class="input-row">
    <input
      id="textInput"
      type="text"
      placeholder="Напиши Зее..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button class="send" onclick="sendMessage()">
      ➤
    </button>
  </div>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment"
    onchange="photoSelected(event)"
  >

</div>

<script>

let voiceEnabled = true;
let currentPhoto = null;

const chat = document.getElementById("chat");
const statusEl = document.getElementById("status");

function addMessage(text, type) {
  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

function speak(text) {

  if (!voiceEnabled) return;

  if (!("speechSynthesis" in window)) {
    console.log("Голос не поддерживается");
    return;
  }

  window.speechSynthesis.cancel();

  const cleanText = text
    .replace(/[*#_`]/g, "")
    .replace(/https?:\/\/\S+/g, "");

  const speech = new SpeechSynthesisUtterance(cleanText);

  speech.lang = "ru-RU";
  speech.rate = 0.95;
  speech.pitch = 1.05;
  speech.volume = 1;

  window.speechSynthesis.speak(speech);
}

function toggleVoice() {

  voiceEnabled = !voiceEnabled;

  const buttons = document.querySelectorAll(".voice");

  if (voiceEnabled) {
    buttons[0].textContent = "🔊 Голос Зеи включён";
    speak("Голос Зеи включён");
  } else {
    buttons[0].textContent = "🔇 Голос Зеи выключен";
    window.speechSynthesis.cancel();
  }
}

async function sendMessage() {

  const input = document.getElementById("textInput");
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  statusEl.textContent = "🧠 Зея думает...";

  try {

    const response = await fetch("/api", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка сервера");
    }

    const answer =
      data.reply ||
      data.response ||
      data.message ||
      "Я пока не получила ответ.";

    addMessage(answer, "zeia");

    speak(answer);

    statusEl.textContent = "";

  } catch (error) {

    console.error(error);

    const errorText =
      "Бро, я не смогла связаться с AI-мозгом 😔\n" +
      "Проверь API и OPENAI_API_KEY.";

    addMessage(errorText, "zeia");

    statusEl.textContent = "";
  }
}

function openCamera() {
  document.getElementById("photoInput").click();
}

function photoSelected(event) {

  const file = event.target.files[0];

  if (!file) return;

  currentPhoto = file;

  const reader = new FileReader();

  reader.onload = function(e) {

    document.getElementById("photo").src = e.target.result;

    document.getElementById("photoPreview").style.display = "block";

    document.getElementById("photoButtons").style.display = "grid";

    addMessage(
      "📸 Фото получено. Я готова его посмотреть.",
      "zeia"
    );

  };

  reader.readAsDataURL(file);
}

function deletePhoto() {

  currentPhoto = null;

  document.getElementById("photoInput").value = "";

  document.getElementById("photoPreview").style.display = "none";

  document.getElementById("photoButtons").style.display = "none";
}

async function analyzePhoto() {

  if (!currentPhoto) return;

  statusEl.textContent = "👁️ Зея анализирует фото...";

  try {

    const reader = new FileReader();

    reader.onload = async function() {

      const base64 = reader.result;

      try {

        const response = await fetch("/api", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message:
              "Посмотри на это изображение и подробно опиши, что на нём находится.",
            image: base64
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Ошибка анализа");
        }

        const answer =
          data.reply ||
          data.response ||
          data.message ||
          "Я не смогла описать изображение.";

        addMessage(answer, "zeia");

        speak(answer);

        statusEl.textContent = "";

      } catch (error) {

        console.error(error);

        addMessage(
          "😔 Не получилось проанализировать фото. Проверь API.",
          "zeia"
        );

        statusEl.textContent = "";
      }

    };

    reader.readAsDataURL(currentPhoto);

  } catch (error) {

    console.error(error);

    statusEl.textContent = "";
  }
}

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    addMessage(
      "🎙️ Бро, голосовой ввод не поддерживается этим браузером.",
      "zeia"
    );

    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "ru-RU";
  recognition.continuous = false;
  recognition.interimResults = false;

  statusEl.textContent = "🎙️ Я слушаю...";

  recognition.start();

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    document.getElementById("textInput").value = text;

    statusEl.textContent = "";

    sendMessage();
  };

  recognition.onerror = function() {

    statusEl.textContent = "";

    addMessage(
      "😔 Я не услышала тебя. Попробуй ещё раз.",
      "zeia"
    );
  };

  recognition.onend = function() {
    statusEl.textContent = "";
  };
}

</script>

</body>
</html>
