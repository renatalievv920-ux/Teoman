<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover">

<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Зея — AI Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at top,
            #293b68 0%,
            #111827 42%,
            #05070d 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 92vh;

    padding: 24px;

    border-radius: 32px;

    background: rgba(10, 17, 35, 0.90);

    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 25px 80px rgba(0,0,0,0.55);

    backdrop-filter: blur(25px);

    display: flex;
    flex-direction: column;
}

/* LOGO */

.header {
    text-align: center;
}

.logo {
    width: 90px;
    height: 90px;

    margin: 0 auto;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 44px;

    background:
        linear-gradient(
            135deg,
            #60a5fa,
            #8b5cf6
        );

    box-shadow:
        0 0 40px rgba(96,165,250,0.45);
}

h1 {
    margin: 14px 0 4px;

    font-size: 32px;
}

.status {
    color: #9ca3af;
    font-size: 14px;
}

/* CHAT */

.chat {
    flex: 1;

    min-height: 260px;
    max-height: 43vh;

    overflow-y: auto;

    padding: 15px 0;
}

.message {
    max-width: 86%;

    padding: 14px 17px;

    margin: 10px 0;

    border-radius: 20px;

    font-size: 17px;

    line-height: 1.45;

    word-wrap: break-word;
}

.message.zeia {
    margin-right: auto;

    background:
        rgba(65, 105, 170, 0.24);

    border:
        1px solid rgba(96,165,250,0.25);
}

.message.user {
    margin-left: auto;

    background:
        rgba(124,58,237,0.30);
}

/* PHOTO */

.photo-box {
    display: none;

    margin: 10px 0 15px;

    text-align: center;
}

#preview {
    width: 100%;
    max-height: 330px;

    object-fit: contain;

    border-radius: 22px;

    background: #000;
}

.photo-buttons {
    display: flex;

    gap: 10px;

    margin-top: 10px;
}

.small-button {
    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 17px;

    color: white;

    background: #273449;

    font-size: 15px;
}

.delete-button {
    background: #7f1d1d;
}

/* BUTTONS */

button {
    font-family: inherit;

    color: white;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    transition: transform 0.15s,
                filter 0.15s;
}

button:active {
    transform: scale(0.96);
}

.camera-button {
    width: 100%;

    padding: 17px;

    margin-bottom: 10px;

    border: none;

    border-radius: 20px;

    font-size: 18px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 10px 30px rgba(37,99,235,0.30);
}

.voice-button {
    width: 100%;

    padding: 17px;

    border-radius: 20px;

    font-size: 17px;

    border:
        1px solid rgba(255,255,255,0.10);

    background: #202b3d;
}

.voice-button.active {
    background: #b91c1c;

    animation: listening 1s infinite;
}

.voice-button.speaking {
    background: #166534;
}

.voice-enable {
    width: 100%;

    margin-bottom: 10px;

    padding: 12px;

    border: none;

    border-radius: 15px;

    font-size: 15px;

    background: #172033;

    color: #cbd5e1;
}

@keyframes listening {
    50% {
        box-shadow:
            0 0 25px rgba(239,68,68,0.55);
    }
}

/* INPUT */

.input-row {
    display: flex;

    gap: 9px;

    margin-top: 10px;
}

input {
    flex: 1;

    min-width: 0;

    padding: 16px;

    border-radius: 18px;

    border:
        1px solid rgba(255,255,255,0.10);

    outline: none;

    background: #111827;

    color: white;

    font-size: 16px;
}

input::placeholder {
    color: #64748b;
}

.send-button {
    width: 58px;

    border: none;

    border-radius: 18px;

    background: #2563eb;

    font-size: 23px;
}

#cameraInput {
    display: none;
}

.analyzing {
    color: #93c5fd;

    animation:
        pulse 1s infinite;
}

@keyframes pulse {
    50% {
        opacity: 0.4;
    }
}

@media (max-width: 420px) {

    body {
        padding: 0;
    }

    .app {
        min-height: 100vh;

        border-radius: 0;

        border: none;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🤖
        </div>

        <h1>Зея</h1>

        <div
            class="status"
            id="status">

            Твой AI-помощник

        </div>

    </div>


    <!-- CHAT -->

    <div
        class="chat"
        id="chat">

        <div class="message zeia">
            Привет! Я Зея 🤖<br>
            Я готова тебя слушать.
        </div>

    </div>


    <!-- PHOTO -->

    <div
        class="photo-box"
        id="photoBox">

        <img
            id="preview"
            alt="Фото">

        <div class="photo-buttons">

            <button
                class="small-button"
                onclick="analyzePhoto()">

                🔍 Анализировать

            </button>

            <button
                class="small-button delete-button"
                onclick="deletePhoto()">

                🗑️ Удалить

            </button>

        </div>

    </div>


    <!-- CAMERA -->

    <button
        class="camera-button"
        onclick="openCamera()">

        📸 Открыть камеру

    </button>


    <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
        onchange="photoSelected(event)">


    <!-- ENABLE VOICE -->

    <button
        class="voice-enable"
        onclick="enableVoice()">

        🔊 Включить голос Зеи

    </button>


    <!-- MICROPHONE -->

    <button
        id="voiceButton"
        class="voice-button"
        onclick="startVoice()">

        🎙️ Говорить с Зеей

    </button>


    <!-- TEXT -->

    <div class="input-row">

        <input
            id="textInput"
            type="text"
            placeholder="Напиши Зее..."
            autocomplete="off"
            onkeydown="handleEnter(event)">

        <button
            class="send-button"
            onclick="sendMessage()">

            ➤

        </button>

    </div>

</div>


<script>

/* =====================================
   ПЕРЕМЕННЫЕ
===================================== */

let currentPhoto = null;

let isVoiceEnabled = false;


/* =====================================
   СООБЩЕНИЯ
===================================== */

function addMessage(text, type = "user") {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;


    // Зея говорит только свои сообщения
    if (type === "zeia") {

        speak(text);

    }
}


/* =====================================
   ГОЛОС ЗЕИ
===================================== */

function enableVoice() {

    if (!("speechSynthesis" in window)) {

        alert(
            "Голосовая озвучка не поддерживается этим браузером."
        );

        return;
    }


    const test =
        new SpeechSynthesisUtterance(
            "Голос Зеи включён."
        );

    test.lang = "ru-RU";

    test.rate = 0.95;

    test.pitch = 1.05;

    test.volume = 1;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(test);

    isVoiceEnabled = true;


    const status =
        document.getElementById("status");

    status.innerText =
        "🔊 Голос Зеи включён";


    setTimeout(() => {

        status.innerText =
            "Твой AI-помощник";

    }, 2500);
}


/* =====================================
   ОЗВУЧКА
===================================== */

function speak(text) {

    if (!isVoiceEnabled) {
        return;
    }


    if (!("speechSynthesis" in window)) {
        return;
    }


    window.speechSynthesis.cancel();


    const cleanText =
        text
        .replace(/<[^>]*>/g, "")
        .replace(
            /[\u{1F300}-\u{1FAFF}]/gu,
            ""
        )
        .trim();


    if (!cleanText) {
        return;
    }


    const speech =
        new SpeechSynthesisUtterance(
            cleanText
        );


    speech.lang = "ru-RU";

    speech.rate = 0.95;

    speech.pitch = 1.05;

    speech.volume = 1;


    speech.onstart = function() {

        const button =
            document.getElementById(
                "voiceButton"
            );

        button.classList.add(
            "speaking"
        );

    };


    speech.onend = function() {

        const button =
            document.getElementById(
                "voiceButton"
            );

        button.classList.remove(
            "speaking"
        );

    };


    window.speechSynthesis.speak(
        speech
    );
}


/* =====================================
   ОТПРАВКА ТЕКСТА
===================================== */

function sendMessage() {

    const input =
        document.getElementById(
            "textInput"
        );

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";


    /*
       ВРЕМЕННЫЙ ОТВЕТ.

       Позже здесь подключим
       настоящий AI через /api.
    */

    setTimeout(() => {

        addMessage(
            "Я тебя услышала 😊",
            "zeia"
        );

    }, 500);
}


/* =====================================
   ENTER
===================================== */

function handleEnter(event) {

    if (event.key === "Enter") {

        sendMessage();

    }
}


/* =====================================
   КАМЕРА
===================================== */

function openCamera() {

    const input =
        document.getElementById(
            "cameraInput"
        );

    input.click();
}


/* =====================================
   ФОТО ПОЛУЧЕНО
===================================== */

function photoSelected(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    currentPhoto = file;


    const imageURL =
        URL.createObjectURL(file);


    const preview =
        document.getElementById(
            "preview"
        );


    preview.src =
        imageURL;


    document.getElementById(
        "photoBox"
    ).style.display = "block";


    addMessage(
        "📸 Фотография получена. Я готова её посмотреть.",
        "zeia"
    );
}


/* =====================================
   АНАЛИЗ ФОТО
===================================== */

function analyzePhoto() {

    if (!currentPhoto) {

        addMessage(
            "Сначала сделай фотографию 📸",
            "zeia"
        );

        return;
    }


    const status =
        document.getElementById(
            "status"
        );


    status.innerHTML =
        '<span class="analyzing">' +
        '🔍 Анализирую фотографию...' +
        '</span>';


    addMessage(
        "🔍 Сейчас посмотрю на фотографию...",
        "zeia"
    );


    /*
       Здесь следующим шагом подключим
       настоящий анализ изображения.

       Фото будет отправляться в API,
       после чего Зея сможет рассказать,
       что находится на изображении.
    */


    setTimeout(() => {

        status.innerText =
            "Твой AI-помощник";


        addMessage(
            "Фотография у меня есть 👍 Теперь можно подключить настоящий AI-анализ.",
            "zeia"
        );

    }, 1500);
}


/* =====================================
   УДАЛЕНИЕ ФОТО
===================================== */

function deletePhoto() {

    currentPhoto = null;


    document.getElementById(
        "preview"
    ).src = "";


    document.getElementById(
        "photoBox"
    ).style.display = "none";


    document.getElementById(
        "cameraInput"
    ).value = "";
}


/* =====================================
   ГОЛОСОВОЕ РАСПОЗНАВАНИЕ
===================================== */

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        addMessage(
            "Голосовое распознавание не поддерживается этим браузером.",
            "zeia"
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "ru-RU";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    const button =
        document.getElementById(
            "voiceButton"
        );


    button.classList.add(
        "active"
    );


    button.innerText =
        "🔴 Слушаю тебя...";


    recognition.start();


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                .transcript;


            addMessage(
                text,
                "user"
            );


            /*
               Пока простой ответ.
               Потом подключим настоящий AI.
            */

            setTimeout(() => {

                addMessage(
                    "Да, я тебя слышу 😊",
                    "zeia"
                );

            }, 400);

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Ошибка:",
                event.error
            );


            addMessage(
                "Я не смогла тебя услышать. Попробуй ещё раз 🎙️",
                "zeia"
            );

        };


    recognition.onend =
        function() {

            button.classList.remove(
                "active"
            );


            button.innerText =
                "🎙️ Говорить с Зеей";

        };
}

</script>

</body>
</html>
