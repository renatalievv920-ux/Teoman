<meta charset="UTF-8">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  min-height: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  color: #fff;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(
      circle at 50% -10%,
      #3655a0 0%,
      #172341 25%,
      #090e1d 60%,
      #040711 100%
    );
  overflow-x: hidden;
}
body::before,
body::after {
  content: "";
  position: fixed;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .18;
  pointer-events: none;
  z-index: -1;
}
body::before {
  background: #4169e1;
  top: 15%;
  left: -130px;
}
body::after {
  background: #8a4dff;
  right: -130px;
  bottom: 15%;
}
.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 20px 14px 40px;
}
.header {
  text-align: center;
  margin: 5px 0 22px;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: .3px;
  text-shadow: 0 0 20px rgba(90,130,255,.35);
}
.robot {
  width: 76px;
  height: 76px;
  margin: 0 auto 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background:
    linear-gradient(
      145deg,
      #263d78,
      #111b37
    );
  border: 1px solid rgba(130,160,255,.45);
  box-shadow:
    0 0 30px rgba(75,110,255,.4),
    inset 0 0 25px rgba(100,140,255,.12);
  font-size: 42px;
  animation: robotFloat 3s ease-in-out infinite;
}
@keyframes robotFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-5px);
  }
}
.online {
  margin-top: 7px;
  color: #5cff91;
  font-size: 17px;
  font-weight: 700;
  text-shadow: 0 0 14px rgba(92,255,145,.45);
}
.online::before {
  content: "";
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 7px;
  border-radius: 50%;
  background: #4dff79;
  box-shadow: 0 0 12px #4dff79;
  animation: pulse 1.6s infinite;
}
@keyframes pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: .45;
    transform: scale(.75);
  }
}
/* ЯЗЫК */
.language-box {
  margin: 0 auto 16px;
  max-width: 500px;
}
.language-label {
  text-align: center;
  color: #aab6cf;
  font-size: 14px;
  margin-bottom: 8px;
}
.language-select {
  width: 100%;
  padding: 15px 18px;
  border-radius: 18px;
  border: 1px solid #405581;
  background:
    linear-gradient(
      145deg,
      #172541,
      #0d162b
    );
  color: white;
  font-size: 17px;
  font-weight: 600;
  outline: none;
  box-shadow:
    0 8px 25px rgba(0,0,0,.2);
}
.language-select:focus {
  border-color: #6384ff;
  box-shadow:
    0 0 0 3px rgba(80,110,255,.12),
    0 0 25px rgba(70,100,255,.15);
}
/* ЧАТ */
.chat {
  min-height: 460px;
  max-height: 62vh;
  overflow-y: auto;
  padding: 18px;
  border-radius: 30px;
  background:
    linear-gradient(
      145deg,
      rgba(19,30,56,.9),
      rgba(8,14,29,.88)
    );
  border: 1px solid rgba(115,145,220,.35);
  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    inset 0 0 45px rgba(70,100,180,.08);
  backdrop-filter: blur(20px);
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar {
  width: 5px;
}
.chat::-webkit-scrollbar-thumb {
  background: #405581;
  border-radius: 10px;
}
/* СООБЩЕНИЯ */
.message {
  max-width: 88%;
  padding: 16px 19px;
  margin: 13px 0;
  border-radius: 22px;
  font-size: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
  animation: messageAppear .3s ease;
}
@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.bot {
  margin-right: auto;
  background:
    linear-gradient(
      145deg,
      #1b2b4b,
      #141f37
    );
  border: 1px solid rgba(88,120,180,.45);
  box-shadow:
    0 8px 25px rgba(0,0,0,.25);
}
.user {
  margin-left: auto;
  background:
    linear-gradient(
      145deg,
      #4169e1,
      #617fff
    );
  border: 1px solid rgba(150,170,255,.25);
  box-shadow:
    0 8px 28px rgba(50,85,220,.3);
}
/* ПЕЧАТЬ */
.typing {
  display: none;
  width: fit-content;
  padding: 11px 16px;
  margin: 10px 0;
  border-radius: 18px;
  background: #18243d;
  border: 1px solid #2d4167;
  color: #91a0ba;
  font-size: 15px;
}
.typing span {
  display: inline-block;
  margin: 0 2px;
  animation: blink 1.4s infinite;
}
.typing span:nth-child(2) {
  animation-delay: .2s;
}
.typing span:nth-child(3) {
  animation-delay: .4s;
}
@keyframes blink {
  0%, 60%, 100% {
    opacity: .25;
  }
  30% {
    opacity: 1;
  }
}
/* ВВОД */
.input-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
input {
  min-width: 0;
  flex: 1;
  padding: 18px 20px;
  border-radius: 23px;
  border: 1px solid #354b73;
  background:
    rgba(10,17,34,.94);
  color: white;
  font-size: 18px;
  outline: none;
  box-shadow:
    inset 0 0 20px rgba(0,0,0,.2);
  transition:
    border .2s ease,
    box-shadow .2s ease;
}
input::placeholder {
  color: #8992a5;
}
input:focus {
  border-color: #6384ff;
  box-shadow:
    0 0 0 3px rgba(80,110,255,.12),
    0 0 28px rgba(70,100,255,.18);
}
.send {
  flex: 0 0 68px;
  border: none;
  border-radius: 23px;
  background:
    linear-gradient(
      145deg,
      #4169e1,
      #6682ff
    );
  color: white;
  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
  box-shadow:
    0 8px 28px rgba(55,90,220,.38);
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}
.send:hover {
  box-shadow:
    0 10px 35px rgba(65,105,225,.55);
}
.send:active {
  transform: scale(.93);
}
/* СТАТУС */
.status {
  min-height: 22px;
  margin-top: 10px;
  text-align: center;
  color: #91a0ba;
  font-size: 15px;
}
/* КНОПКИ */
.buttons {
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin-top: 8px;
}
button {
  width: 100%;
  min-height: 60px;
  border: none;
  border-radius: 20px;
  color: white;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition:
    transform .15s ease,
    filter .15s ease,
    box-shadow .15s ease;
}
button:hover {
  filter: brightness(1.08);
}
button:active {
  transform: scale(.97);
}
.voice {
  background:
    linear-gradient(
      135deg,
      #32b94f,
      #69dc63
    );
  box-shadow:
    0 8px 25px rgba(50,190,75,.25);
}
.voice.listening {
  background:
    linear-gradient(
      135deg,
      #e53935,
      #ff6b6b
    );
  animation:
    listeningPulse 1s infinite;
}
@keyframes listeningPulse {
  0%, 100% {
    box-shadow:
      0 0 0 rgba(255,70,70,0);
  }
  50% {
    box-shadow:
      0 0 28px rgba(255,70,70,.55);
  }
}
.speak {
  background:
    linear-gradient(
      135deg,
      #6735dc,
      #854cff
    );
  box-shadow:
    0 8px 25px rgba(110,55,230,.25);
}
.clear {
  background:
    linear-gradient(
      135deg,
      #26344d,
      #34445f
    );
  box-shadow:
    0 8px 20px rgba(0,0,0,.2);
}
/* МОБИЛЬНАЯ ВЕРСИЯ */
@media (max-width: 600px) {
  .container {
    padding:
      12px
      12px
      30px;
  }
  .header {
    font-size: 27px;
    margin-top: 2px;
  }
  .robot {
    width: 68px;
    height: 68px;
    font-size: 38px;
  }
  .online {
    font-size: 16px;
  }
  .chat {
    min-height: 470px;
    max-height: 58vh;
    border-radius: 27px;
    padding: 14px;
  }
  .message {
    max-width: 92%;
    font-size: 17px;
    padding: 15px 17px;
  }
  input {
    font-size: 17px;
    padding: 17px;
  }
  .send {
    flex-basis: 62px;
    border-radius: 21px;
  }
  button {
    min-height: 62px;
    font-size: 18px;
  }
}
@media (max-width: 380px) {
  .container {
    padding-left: 9px;
    padding-right: 9px;
  }
  .chat {
    min-height: 430px;
  }
  .message {
    font-size: 16px;
  }
  input {
    font-size: 16px;
  }
}

</head>

    welcome: "你好！👋 我是 Zeya。有什么可以帮助你的吗？",
    cleared: "聊天已清除 🧹\n我准备好再次听你说话了！",
    noAnswer: "目前没有可以朗读的内容。",
    noVoice: "此浏览器不支持语音输入。",
    noSpeech: "此浏览器不支持语音合成。",
    micError: "我没有听清你说的话",
    connection: "无法连接服务器 😕",
    error: "连接错误",
    ready: "准备听你说话",
    memoryCleared: "记忆已清除"
  },
  "ja-JP": {
    name: "ゼヤ",
    online: "聞く準備ができています",
    placeholder: "ゼヤに入力...",
    voice: "🎙️ ゼヤと話す",
    listening: "🔴 聞いています...",
    speak: "🔊 最後の回答を読み上げる",
    clear: "🧹 メモリを消去",
    language: "🌐 ゼヤの言語",
    thinking: "ゼヤが考えています... 🤖",
    speaking: "話してください...",
    welcome: "こんにちは！👋 私はゼヤです。どうお手伝いしましょうか？",
    cleared: "チャットを消去しました 🧹\nもう一度お話を聞く準備ができています！",
    noAnswer: "読み上げる回答がありません。",
    noVoice: "このブラウザでは音声入力に対応していません。",
    noSpeech: "音声読み上げに対応していません。",
    micError: "聞き取れませんでした",
    connection: "サーバーに接続できませんでした 😕",
    error: "接続エラー",
    ready: "聞く準備ができています",
    memoryCleared: "メモリを消去しました"
  }
};
/* =========================
   ПАМЯТЬ
========================= */
let memory = JSON.parse(
  localStorage.getItem("zeya_memory") || "[]"
);
function saveMemory() {
  localStorage.setItem(
    "zeya_memory",
    JSON.stringify(memory)
  );
}
/* =========================
   ТЕКСТ
========================= */
function t(key) {
  return (
    translations[currentLanguage]?.[key]
    ||
    translations["en-US"][key]
    ||
    key
  );
}
/* =========================
   ЯЗЫК
========================= */
function setLanguage(language) {
  currentLanguage = language;
  localStorage.setItem(
    "zeya_language",
    language
  );
  updateInterface();
}
/* =========================
   ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
========================= */
function updateInterface() {
  languageSelect.value =
    currentLanguage;
  onlineText.textContent =
    t("online");
  input.placeholder =
    t("placeholder");
  voiceButton.textContent =
    t("voice");
  speakButton.textContent =
    t("speak");
  clearButton.textContent =
    t("clear");
  languageLabel.textContent =
    t("language");
}
/* =========================
   ПОКАЗ СООБЩЕНИЯ
========================= */
function addMessage(text, type) {
  const message =
    document.createElement("div");
  message.className =
    "message " + type;
  message.textContent =
    text;
  chat.insertBefore(
    message,
    typing
  );
  chat.scrollTop =
    chat.scrollHeight;
}
/* =========================
   ЗАГРУЗКА ПАМЯТИ
========================= */
function loadMemory() {
  chat.innerHTML = "";
  chat.appendChild(typing);
  if (memory.length === 0) {
    addMessage(
      t("welcome"),
      "bot"
    );
    return;
  }
  for (const item of memory) {
    addMessage(
      item.text,
      item.role === "user"
        ? "user"
        : "bot"
    );
    if (
      item.role === "assistant"
    ) {
      lastAnswer =
        item.text;
    }
  }
}
/* =========================
   ПЕЧАТЬ
========================= */
function showTyping() {
  typing.style.display =
    "block";
  chat.scrollTop =
    chat.scrollHeight;
}
function hideTyping() {
  typing.style.display =
    "none";
}
/* =========================
   ОТПРАВКА
========================= */
async function sendMessage() {
  const message =
    input.value.trim();
  if (!message) return;
  addMessage(
    message,
    "user"
  );
  memory.push({
    role: "user",
    text: message
  });
  saveMemory();
  input.value = "";
  statusText.textContent =
    t("thinking");
  showTyping();
  try {
    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              message: message,
              language: currentLanguage
            })
        }
      );
    if (!response.ok) {
      throw new Error(
        "Ошибка сервера: " +
        response.status
      );
    }
    const data =
      await response.json();
    const answer =
      data.reply ||
      "I didn't receive a response.";
    hideTyping();
    lastAnswer =
      answer;
    addMessage(
      answer,
      "bot"
    );
    memory.push({
      role: "assistant",
      text: answer
    });
    saveMemory();
    statusText.textContent =
      t("ready");
  } catch (error) {
    console.error(error);
    hideTyping();
    addMessage(
      t("connection"),
      "bot"
    );
    statusText.textContent =
      t("error");
  }
}
/* =========================
   ENTER
========================= */
input.addEventListener(
  "keydown",
  function(event) {
    if (
      event.key === "Enter"
    ) {
      event.preventDefault();
      sendMessage();
    }
  }
);
/* =========================
   ГОЛОСОВОЙ ВВОД
========================= */
function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert(
      t("noVoice")
    );
    return;
  }
  if (recognition) {
    recognition.stop();
    recognition = null;
    return;
  }
  recognition =
    new SpeechRecognition();
  recognition.lang =
    currentLanguage;
  recognition.continuous =
    false;
  recognition.interimResults =
    false;
  recognition.maxAlternatives =
    1;
  recognition.onstart =
    function() {
      voiceButton.classList.add(
        "listening"
      );
      voiceButton.textContent =
        t("listening");
      statusText.textContent =
        t("speaking");
    };
  recognition.onresult =
    function(event) {
      const text =
        event.results[0][0]
          .transcript;
      input.value =
        text;
      voiceButton.classList.remove(
        "listening"
      );
      voiceButton.textContent =
        t("voice");
      statusText.textContent =
        "";
      recognition.stop();
      recognition = null;
      sendMessage();
    };
  recognition.onerror =
    function(event) {
      console.log(
        "Ошибка микрофона:",
        event.error
      );
      voiceButton.classList.remove(
        "listening"
      );
      voiceButton.textContent =
        t("voice");
      statusText.textContent =
        t("micError");
      recognition = null;
    };
  recognition.onend =
    function() {
      voiceButton.classList.remove(
        "listening"
      );
      voiceButton.textContent =
        t("voice");
      recognition = null;
    };
  try {
    recognition.start();
  } catch (error) {
    console.error(error);
    recognition = null;
  }
}
/* =========================
   ПОЛУЧЕНИЕ ГОЛОСОВ
========================= */
function getVoices() {
  if (
    !window.speechSynthesis
  ) {
    return [];
  }
  return window.speechSynthesis
    .getVoices();
}
/* =========================
   ПОИСК ЖЕНСКОГО ГОЛОСА
========================= */
function findFemaleVoice(
  voices,
  language
) {
  const lang =
    language
      .toLowerCase()
      .split("-")[0];
  const sameLanguage =
    voices.filter(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(lang)
    );
  if (
    sameLanguage.length === 0
  ) {
    return null;
  }
  const femaleKeywords = [
    "female",
    "woman",
    "girl",
    "жен",
    "milena",
    "alena",
    "elena",
    "anna",
    "katya",
    "irina",
    "yuna",
    "zira",
    "samantha",
    "victoria",
    "zira",
    "susan",
    "hazel",
    "amelie",
    "google français",
    "google español",
    "google italiano"
  ];
  const female =
    sameLanguage.find(
      voice => {
        const name =
          voice.name
            .toLowerCase();
        return femaleKeywords
          .some(
            keyword =>
              name.includes(keyword)
          );
      }
    );
  return (
    female ||
    sameLanguage[0]
  );
}
/* =========================
   ОЗВУЧИВАНИЕ
========================= */
function speakLastAnswer() {
  if (!lastAnswer) {
    alert(
      t("noAnswer")
    );
    return;
  }
  if (
    !window.speechSynthesis
  ) {
    alert(
      t("noSpeech")
    );
    return;
  }
  window.speechSynthesis.cancel();
  const speech =
    new SpeechSynthesisUtterance(
      lastAnswer
    );
  speech.lang =
    currentLanguage;
  const voices =
    getVoices();
  const femaleVoice =
    findFemaleVoice(
      voices,
      currentLanguage
    );
  if (femaleVoice) {
    speech.voice =
      femaleVoice;
  }
  speech.rate =
    0.95;
  speech.pitch =
    1.12;
  speech.volume =
    1;
  window.speechSynthesis.speak(
    speech
  );
}
/* =========================
   ЗАГРУЗКА ГОЛОСОВ
========================= */
if (
  window.speechSynthesis
) {
  window.speechSynthesis
    .addEventListener(
      "voiceschanged",
      function() {
        getVoices();
      }
    );
}
/* =========================
   ОЧИСТКА ПАМЯТИ
========================= */
function clearChat() {
  if (
    window.speechSynthesis
  ) {
    window.speechSynthesis.cancel();
  }
  memory = [];
  localStorage.removeItem(
    "zeya_memory"
  );
  lastAnswer = "";
  chat.innerHTML = "";
  chat.appendChild(
    typing
  );
  addMessage(
    t("cleared"),
    "bot"
  );
  statusText.textContent =
    t("memoryCleared");
}
/* =========================
   ВЫБОР ЯЗЫКА
========================= */
languageSelect.addEventListener(
  "change",
  function() {
    setLanguage(
      this.value
    );
    loadMemory();
    statusText.textContent =
      t("ready");
  }
);
/* =========================
   ЗАПУСК
========================= */
updateInterface();
loadMemory();
input.focus();
</script>
